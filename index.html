      $$('[data-t],[data-k],[data-p]',el).forEach(s=>s.disabled=mode!=='sample');});
    [T,K,Pp].forEach(s=>s.oninput=draw);
    BW.oninput=()=>$('[data-bwo]',el).textContent=BW.value;

  },
  after:`<p>Try greedy a few times. It always says the same thing and gets stuck repeating "and warm". Real models do this too, which is why repetition penalties exist. Then try temperature 2 with top-p 1, and notice nonsense like "purple" creeping in. Top-p 0.9 trims that long tail without making the output robotic.</p>`,
  prod:'Decoding settings are product decisions. Use temperature 0 (or near it) for extraction, classification and tool calls where you want the same answer every time. Use moderate temperature with top-p for writing and brainstorming. If a model loops or repeats, the fix is often in decoding, not in the prompt.',
  quiz:[
    {q:'Compared with temperature 1.0, temperature 0.2:',o:['Flattens the distribution so rare tokens appear more','Sharpens the distribution toward the most likely tokens','Removes all but one token from the vocabulary','Has no effect on sampling'],a:1,why:'Dividing logits by a small number widens the gaps between them, so softmax piles probability onto the leaders.'},
    {q:'Top-p of 0.9 keeps:',o:['The 9 most likely tokens','Every token above 0.9 probability','The smallest set of top tokens whose probabilities add up to at least 0.9','90% of the vocabulary'],a:2,why:'It walks down the sorted list adding probabilities until it reaches 0.9, so the number of tokens kept changes with the model\'s confidence.'},
    {q:'You are extracting invoice fields into JSON and need the same output every run. Best choice:',o:['Temperature 1.5 with top-k 50','Greedy decoding or temperature near 0','Top-p 0.99 with high temperature','Beam width 1 with temperature 2'],a:1,why:'Deterministic decoding gives repeatable, format-stable output. Save randomness for creative tasks.'}

};

/* ===== Module 9: Inference basics ===== */
MODULES[9] = {
  intro:`<p>Running a trained model is called <strong>inference</strong>. For an LLM it happens in two very different phases.</p>
  <p><strong>Prefill</strong> processes your whole prompt at once. All prompt tokens go through the network in parallel, one big matrix multiply per layer. The GPU's math units are busy, so prefill is <strong>compute-bound</strong>. Its cost sets the <strong>time to first token</strong> (TTFT).</p>
  <p><strong>Decode</strong> then generates the answer one token at a time. Each new token depends on the one before it, so the steps can't run in parallel. Every step reads all of the model's weights from GPU memory to do a tiny amount of math for a single token. The math units mostly wait on memory, so decode is <strong>memory-bound</strong>. Its speed is set by memory bandwidth divided by model size.</p>
  <div class="formula">decode time per token ≈ model size in bytes ÷ memory bandwidth</div>`,
  hint:'Pick a model and prompt size, then press Play to watch prefill run once and decode tick token by token.',
  mount(el,c){
    const SAMPLE='Sure. Prefill reads the whole prompt in one pass, then decode writes the answer one token at a time, and each step has to wait for the one before it to finish before it can begin'.split(' ');
    el.innerHTML=`<div class="controls" style="margin-top:0">
        <div class="ctl"><label>Model size</label><select data-m><option value="7">7B parameters</option><option value="13">13B parameters</option><option value="70">70B parameters</option></select></div>
        <div class="ctl"><label>Prompt tokens <output data-po></output></label><input type="range" min="100" max="8000" step="100" value="1000" data-p></div>
        <div class="ctl"><label>Output tokens <output data-oo></output></label><input type="range" min="10" max="400" step="10" value="60" data-o></div>
      </div>
      <svg viewBox="0 0 640 120" data-tl aria-label="Inference timeline"></svg>
      <div class="stream" aria-live="off"><span class="pf" data-pf></span><span data-gen></span></div>
      <div class="row" style="margin:.75rem 0"><button class="btn" data-play>Play</button><button class="btn-ghost" data-reset>Reset</button><span class="muted num" data-clock style="margin-left:auto"></span></div>
      <div class="stats">
        <div class="stat"><span>Time to first token</span><strong data-ttft></strong></div>
        <div class="stat"><span>Per output token</span><strong data-pt></strong></div>
        <div class="stat"><span>Output speed</span><strong data-tps></strong></div>
        <div class="stat"><span>Total</span><strong data-tot></strong></div>
      </div>
      <div class="split">
        <div class="phase"><b>Prefill is compute-bound</b><p data-pfx></p><div class="meter"><span data-pfm></span></div><small class="muted">GPU math units busy</small></div>
        <div class="phase"><b>Decode is memory-bound</b><p data-dcx></p><div class="meter"><span data-dcm></span></div><small class="muted">GPU math units busy</small></div>
      </div>
      <p class="muted" style="font-size:.85rem">Illustrative GPU: 400 TFLOP/s of usable compute, 2 TB/s of memory bandwidth, 16-bit weights, one request at a time.</p>`;
    const M=$('[data-m]',el),P=$('[data-p]',el),O=$('[data-o]',el),tl=$('[data-tl]',el);
    let anim=null, prog=0; // prog in real seconds
    const cur=()=>Infer.timing(+M.value,+P.value,+O.value);
    const drawTL=()=>{
      const t=cur(), W=640, L=10, R=10, span=W-L-R, sc=span/t.total;
      const pw=Math.max(3,t.prefill*sc), done=Math.min(prog,t.total);
      const decDone=Math.max(0,done-t.prefill), nDec=Math.min(+O.value,Math.floor(decDone/t.perTok+1e-9));
      let ticks=''; const nT=+O.value, tickEvery=Math.max(1,Math.ceil(nT/80));
      for(let i=0;i<nT;i+=tickEvery){ const x=L+pw+i*t.perTok*sc; ticks+=`<rect x="${x.toFixed(1)}" y="44" width="${Math.max(1,t.perTok*sc*tickEvery-1).toFixed(1)}" height="26" rx="2" style="fill:var(--viz-1);opacity:${i<nDec?1:.18}"/>`; }
      tl.innerHTML=`<rect x="${L}" y="44" width="${pw.toFixed(1)}" height="26" rx="3" style="fill:var(--viz-2);opacity:${done>=t.prefill?1:.25+0.75*done/t.prefill}"/>
        ${ticks}
        <line x1="${(L+done*sc).toFixed(1)}" y1="32" x2="${(L+done*sc).toFixed(1)}" y2="82" style="stroke:var(--ink);stroke-width:2"/>
        <text x="${L}" y="24" font-size="12" font-weight="700">Prefill ${fmtMs(t.prefill)}</text>
        <text x="${Math.min(W-R, L+pw+8)}" y="24" font-size="12" font-weight="700">Decode: ${nT} steps × ${fmtMs(t.perTok)}</text>
        <text x="${L}" y="100" font-size="11">0</text><text x="${W-R}" y="100" font-size="11" text-anchor="end">${fmtMs(t.total)}</text>
        <text x="${L+pw/2}" y="114" font-size="11" text-anchor="middle">${(+P.value).toLocaleString()} tokens at once</text>`;
      $('[data-pf]',el).textContent=done>=t.prefill?`[${(+P.value).toLocaleString()} prompt tokens processed together]`:'[prefilling…]';
      $('[data-gen]',el).textContent=' '+Array.from({length:nDec},(_,i)=>SAMPLE[i%SAMPLE.length]).join(' ');
      $('[data-clock]',el).textContent=`t = ${fmtMs(done)}`;
    };
    const drawStats=()=>{
      const t=cur();
      $('[data-po]',el).textContent=(+P.value).toLocaleString(); $('[data-oo]',el).textContent=O.value;
      $('[data-ttft]',el).textContent=fmtMs(t.ttft); $('[data-pt]',el).textContent=fmtMs(t.perTok);
      $('[data-tps]',el).textContent=Math.round(t.tps)+' tok/s'; $('[data-tot]',el).textContent=fmtMs(t.total);
      const P_=+M.value*1e9, pfUtil=(2*P_*(+P.value)/Infer.GPU.flops)/t.prefill, dcUtil=(2*P_/Infer.GPU.flops)/t.perTok;
      $('[data-pfx]',el).textContent=`Each weight read from memory is used for ${(+P.value).toLocaleString()} tokens, so the math is the bottleneck.`;
      $('[data-dcx]',el).textContent=`Each step reads all ${fmt(+M.value*2,0)} GB of weights to produce one token. The math units sit idle waiting on memory.`;
      $('[data-pfm]',el).style.width=(pfUtil*100).toFixed(1)+'%'; $('[data-pfm]',el).textContent=Math.round(pfUtil*100)+'%';
      $('[data-dcm]',el).style.width=Math.max(1.5,dcUtil*100).toFixed(1)+'%'; $('[data-dcm]',el).textContent=(dcUtil*100).toFixed(1)+'%';
      drawTL();
    };
    const stop=()=>{ if(anim){c.stop(anim);anim=null} $('[data-play]',el).textContent='Play'; };
    $('[data-play]',el).onclick=()=>{
      if(anim){stop();return}
      const t=cur(); if(prog>=t.total) prog=0;
      const speed=t.total/clamp(t.total,3,6); // play back in 3 to 6 seconds, keeping real proportions
      $('[data-play]',el).textContent='Pause';
      let last=performance.now();
      anim=c.every(()=>{ const now=performance.now(); prog+= (now-last)/1000*speed; last=now; if(prog>=t.total){prog=t.total;stop()} drawTL(); },30);
    };
    $('[data-reset]',el).onclick=()=>{stop();prog=0;drawTL()};
    [M,P,O].forEach(x=>x.oninput=()=>{stop();prog=0;drawStats()});
    drawStats();
  },
  prod:'Users feel two numbers: time to first token (prefill) and tokens per second (decode). Long prompts hurt TTFT. Long answers hurt total latency. Because a single request barely uses the GPU\'s compute during decode, serving systems batch many requests together, which is where most of the cost savings in the next few modules come from.',
  quiz:[
    {q:'Why can\'t an LLM generate all output tokens in parallel?',o:['GPUs can only run one operation at a time','Each token depends on the tokens generated before it','The tokenizer is single-threaded','Prompt tokens must be processed first'],a:1,why:'Token t+1 is conditioned on token t. You can\'t compute it until token t exists.'},
    {q:'Decode on one request is usually limited by:',o:['Memory bandwidth, because all weights are read for each token','Compute, because the math is heavy','Network latency','The size of the vocabulary'],a:0,why:'One token\'s worth of math per full read of the weights. Bandwidth, not FLOPs, sets the pace.'},
    {q:'A user complains the first word takes ages to appear on a 20,000-token prompt. The phase to optimize is:',o:['Decode','Prefill','Tokenization','Sampling'],a:1,why:'Time to first token is dominated by prefill, which grows with prompt length.'}
  ]
};

/* ===== Module 10: KV cache ===== */
MODULES[10] = {
  intro:`<p>In attention, every new token needs the <strong>keys and values</strong> of all earlier tokens. A naive decoder recomputes K and V for the whole sequence at every step, even though the earlier tokens haven't changed. Step 100 redoes the work of steps 1 to 99.</p>
  <p>The <strong>KV cache</strong> fixes this. Compute K and V once per token, store them in GPU memory, and at each step only compute them for the newest token. Work per step drops from growing with the sequence to constant.</p>
  <p>The price is memory. For every token, every layer stores a key and a value vector for each KV head:</p>
  <div class="formula">KV cache bytes = 2 (K and V) × layers × KV heads × head_dim × sequence length × batch × bytes per value</div>
  <p>Many newer models use <strong>grouped-query attention (GQA)</strong>: several query heads share one KV head, which shrinks the cache. Llama 3 8B has 32 query heads but only 8 KV heads.</p>`,
  hint:'Press Play with the cache off, then on, and compare the work. Below, size the cache for a real model.',
  mount(el,c){
    const PR=4, GEN=8, N=PR+GEN;
    el.innerHTML=`<div class="row" style="margin-bottom:.75rem"><button class="btn-ghost" data-cache aria-pressed="false">KV cache off</button><button class="btn" data-play>Play</button><button class="btn-ghost" data-reset>Reset</button></div>
      <div class="scroll-x"><svg data-g aria-label="Computation per decode step"></svg></div>
      <div class="stats"><div class="stat"><span>K/V computations so far</span><strong data-now>0</strong></div><div class="stat"><span>Without cache, all ${GEN} steps</span><strong>${KV.work(PR,GEN,false).total}</strong></div><div class="stat"><span>With cache, all ${GEN} steps</span><strong>${KV.work(PR,GEN,true).total}</strong></div></div>
      <p class="msg" data-msg></p>
      <h3 class="subh">KV cache size calculator</h3>
      <div class="controls">
        <div class="ctl"><label>Model</label><select data-pre>${Object.keys(KV.PRESETS).map(k=>`<option>${k}</option>`).join('')}<option value="custom">Custom</option></select></div>
        <div class="ctl"><label>Layers</label><input type="number" min="1" max="200" data-l></div>
        <div class="ctl"><label>KV heads</label><input type="number" min="1" max="128" data-h></div>
        <div class="ctl"><label>Head dimension</label><input type="number" min="16" max="512" step="16" data-d></div>
      </div>
      <div class="controls">
        <div class="ctl"><label>Sequence length <output data-so></output></label><input type="range" min="0" max="8" step="1" value="3" data-s></div>
        <div class="ctl"><label>Concurrent requests <output data-bo></output></label><input type="range" min="1" max="64" step="1" value="1" data-b></div>
        <div class="ctl"><label>Precision</label><select data-by><option value="2">FP16 (2 bytes)</option><option value="1">FP8 (1 byte)</option></select></div>
      </div>
      <div class="formula" data-f></div>
      <div class="stats"><div class="stat"><span>Per token</span><strong data-pt></strong></div><div class="stat"><span>Total KV cache</span><strong data-tot></strong></div><div class="stat"><span>Share of one 80 GB GPU</span><strong data-gpu></strong></div></div>`;
    let cache=false, step=0, run=null;
    const g=$('[data-g]',el);
    const draw=()=>{

    $('[data-play]',el).onclick=()=>{ if(run){stop();return} if(step>=GEN) step=0; $('[data-play]',el).textContent='Pause'; run=c.every(()=>{ step++; draw(); if(step>=GEN) stop(); },550); };

/* ===== Module 11: PagedAttention ===== */
MODULES[11] = {
  intro:`<p>Early serving systems stored each request's KV cache in one <strong>contiguous</strong> chunk of GPU memory. Since you don't know how long an answer will be, you reserve room for the maximum. Most of that reservation sits empty (<strong>internal fragmentation</strong>), and as requests finish they leave odd-sized holes that new requests can't fit into (<strong>external fragmentation</strong>). Studies of these systems found that most KV memory was wasted.</p>
  <p><strong>PagedAttention</strong>, introduced by vLLM, borrows virtual memory from operating systems. The cache is split into small fixed-size <strong>blocks</strong> (here, 4 tokens). A request gets a new block only when it fills its last one, and blocks can live anywhere in memory. A per-request <strong>block table</strong> maps logical blocks to physical ones, just like a page table.</p>
  <p>Blocks also enable <strong>prefix sharing</strong>. If many requests start with the same system prompt, they can all point at the same physical blocks instead of each holding a copy.</p>`,
  hint:'Press Play to run both allocators on the same requests. Then turn on prefix sharing. Click any colored cell to inspect that request.',
  mount(el,c){
    let share=false, run=null, sel=null, reqs=PagedSim.requests(), A, B;
    el.innerHTML=`<div class="row" style="margin-bottom:.75rem"><button class="btn" data-play>Play</button><button class="btn-ghost" data-step>One step</button><button class="btn-ghost" data-reset>Reset</button><button class="btn-ghost" data-share aria-pressed="false">Prefix sharing off</button><span class="muted num" data-t style="margin-left:auto"></span></div>
      <div class="split">
        <div><h3 class="subh" style="margin-top:0">Contiguous allocation</h3><svg data-ga aria-label="Contiguous memory"></svg><div class="stats tight" data-sa></div></div>
        <div><h3 class="subh" style="margin-top:0">Paged allocation (vLLM)</h3><svg data-gb aria-label="Paged memory"></svg><div class="stats tight" data-sb></div></div>
      </div>
      <p class="legend"><span class="key" style="background:var(--viz-2)"></span>tokens stored <span class="key" style="background:rgba(118,97,255,.18);outline:2px dashed var(--viz-2);outline-offset:-2px"></span>reserved but empty <span class="key" style="background:var(--ink-3)"></span>shared system prompt <span class="key" style="background:var(--card-2);outline:2px solid var(--line);outline-offset:-2px"></span>free</p>
      <p class="msg" data-info>Each grid is the same ${PagedSim.SLOTS}-slot GPU memory. Fourteen requests, each starting with the same ${PagedSim.SHARED}-token system prompt, wait in a queue.</p>`;
    const reset=()=>{ A=PagedSim.make('contig',reqs,share); B=PagedSim.make('paged',reqs,share); PagedSim.admit(A); PagedSim.admit(B); sel=null; draw(); };
    const grid=(svg,s)=>{
      const cols=12, cs=26, rows=PagedSim.SLOTS/cols, W=cols*cs+4, H=rows*cs+4, cells=PagedSim.view(s);
      svg.setAttribute('viewBox',`0 0 ${W} ${H}`);
      let out='';
      cells.forEach((x,i)=>{
        const cx=2+(i%cols)*cs, cy=2+Math.floor(i/cols)*cs;
        let st='fill:var(--card-2);stroke:var(--line);stroke-width:1';
        if(x.state==='used') st=`fill:${reqColor(x.owner)}`;
        else if(x.state==='reserved') st=`fill:${reqColor(x.owner)};fill-opacity:.18;stroke:${reqColor(x.owner)};stroke-width:1.5;stroke-dasharray:3 2`;
        else if(x.state==='shared'||x.state==='dup') st=`fill:var(--ink-3)`;
        const isSel = sel!==null && x.owner===sel;
        out+=`<rect x="${cx+1}" y="${cy+1}" width="${cs-2}" height="${cs-2}" rx="4" data-own="${x.owner??''}" style="${st};${isSel?'stroke:var(--ink);stroke-width:2.5;stroke-dasharray:none':''};cursor:${x.owner!==null?'pointer':'default'}"/>`;
        if(x.state==='shared' && i%PagedSim.BLOCK===0) out+=`<text x="${cx+cs/2}" y="${cy+cs/2+4}" font-size="10" text-anchor="middle" style="fill:#fff;pointer-events:none">S</text>`;
      });
      if(s.kind==='paged') for(let b=0;b<PagedSim.NBLOCK;b++){ const i=b*PagedSim.BLOCK, cx=2+(i%cols)*cs, cy=2+Math.floor(i/cols)*cs; out+=`<rect x="${cx}" y="${cy}" width="${cs*PagedSim.BLOCK}" height="${cs}" rx="5" style="fill:none;stroke:var(--ink-2);stroke-width:2;pointer-events:none"/><text x="${cx+3}" y="${cy+9}" font-size="7" style="fill:var(--ink-3);pointer-events:none">${b}</text>`; }
      svg.innerHTML=out;
    };
    const statHtml=s=>{ const t=PagedSim.stats(s); return `<div class="stat"><span>Holding tokens</span><strong>${Math.round(t.util*100)}%</strong></div><div class="stat"><span>Reserved, empty</span><strong>${t.reserved}</strong></div><div class="stat"><span>Running</span><strong>${t.running}</strong></div><div class="stat"><span>Waiting</span><strong>${t.waiting}</strong></div><div class="stat"><span>Finished</span><strong>${t.done} of 14</strong></div>${s.kind==='paged'?`<div class="stat"><span>Preempted</span><strong>${t.preemptions}</strong></div>`:(s.share?`<div class="stat"><span>Duplicate prompt slots</span><strong>${t.dup}</strong></div>`:'')}`; };
    const info=()=>{
      if(sel===null) return;
      const m=$('[data-info]',el);
      if(sel==='S'){ m.innerHTML=`<b>Shared system prompt.</b> ${PagedSim.SHARED} tokens stored once in physical blocks ${B.sharedBlocks?B.sharedBlocks.join(' and '):'(freed)'}, referenced by all ${B.running.length} running requests. Contiguous allocation stores a separate copy for each request.`; return; }
      const qa=A.running.find(q=>q.id===sel), qb=B.running.find(q=>q.id===sel), r=reqs[sel];
      let s=`<b>Request ${sel}</b>: ${r.prompt}-token prompt, allowed up to ${r.maxTok} new tokens, will actually write ${r.actual}. `;
      s+= qa ? `Contiguous: reserved slots ${qa.start} to ${qa.start+qa.reserved-1} (${qa.reserved} slots) and is using ${qa.len}. ` : 'Contiguous: not running. ';
      s+= qb ? `Paged block table: ${(B.share&&B.sharedBlocks?B.sharedBlocks.map((b,i)=>`L${i}→P${b} (shared)`):[]).concat(qb.table.map((b,i)=>`L${i+(B.share?PagedSim.SHARED/PagedSim.BLOCK:0)}→P${b}`)).join(', ')}.` : 'Paged: not running.';
      m.innerHTML=s;
    };
    const draw=()=>{ grid($('[data-ga]',el),A); grid($('[data-gb]',el),B); $('[data-sa]',el).innerHTML=statHtml(A); $('[data-sb]',el).innerHTML=statHtml(B); $('[data-t]',el).textContent=`step ${A.t}`; info();
      if(A.done===14&&B.done===14){ stop(); $('[data-info]',el).innerHTML=`<b>All 14 requests done.</b> Paged finished at step ${B.finishedAt}, contiguous at step ${A.finishedAt}. Paged ran up to ${B.peakRunning} requests at once versus ${A.peakRunning}.`; } };
    const stop=()=>{ if(run){c.stop(run);run=null} $('[data-play]',el).textContent='Play'; };
    const tick=()=>{ if(A.done<14){PagedSim.step(A); if(A.done===14) A.finishedAt=A.t;} if(B.done<14){PagedSim.step(B); if(B.done===14) B.finishedAt=B.t;} draw(); };
    $('[data-play]',el).onclick=()=>{ if(run){stop();return} if(A.done===14&&B.done===14) reset(); $('[data-play]',el).textContent='Pause'; run=c.every(tick,380); };
    $('[data-step]',el).onclick=()=>{ stop(); if(!(A.done===14&&B.done===14)) tick(); };
    $('[data-reset]',el).onclick=()=>{ stop(); reset(); $('[data-info]',el).textContent='Reset. Both memories start with the first requests admitted.'; };
    $('[data-share]',el).onclick=e=>{ share=!share; e.currentTarget.setAttribute('aria-pressed',String(share)); e.currentTarget.textContent=share?'Prefix sharing on':'Prefix sharing off'; stop(); reset(); $('[data-info]',el).innerHTML=share?'Prefix sharing on. In the paged grid the system prompt (S) is stored once. The contiguous grid still keeps a gray copy per request.':'Prefix sharing off. Every request stores its own copy of the system prompt.'; };
    el.addEventListener('click',e=>{ const r=e.target.closest('[data-own]'); if(!r||r.dataset.own==='') return; sel = r.dataset.own==='S' ? 'S' : +r.dataset.own; draw(); });
    reset();
  },
  prod:'PagedAttention is why vLLM and similar servers (TGI, TensorRT-LLM, SGLang) can run several times more concurrent requests on the same GPU. More requests per GPU means lower cost per token. Prefix sharing is also how prompt caching works: a long shared system prompt is stored once and reused.',
  quiz:[
    {q:'Contiguous KV allocation wastes memory mainly because:',o:['GPUs cannot store keys','Each request reserves space for its maximum length up front, and freed regions leave unusable holes','Blocks are too small','The model weights are duplicated'],a:1,why:'Over-reservation is internal fragmentation, and odd-sized holes are external fragmentation.'},
    {q:'In PagedAttention, a block table maps:',o:['Tokens to vocabulary IDs','A request\'s logical KV blocks to physical memory blocks','Layers to GPUs','Users to API keys'],a:1,why:'Exactly like an OS page table: logical order for the request, physical location anywhere in memory.'},
    {q:'Prefix sharing saves memory when:',o:['Requests start with the same tokens, such as a common system prompt','Requests use different models','Outputs are very short','Temperature is zero'],a:0,why:'Identical prefixes produce identical K and V, so their blocks can be shared with a reference count.'}
  ]
};

/* ===== Module 12: Batching and throughput ===== */
MODULES[12] = {
  intro:`<p>Decode on a single request leaves the GPU's math units mostly idle (see Inference basics). The fix is <strong>batching</strong>: run many requests through the model together, so one read of the weights serves many tokens.</p>
  <p><strong>Static batching</strong> groups requests, runs the group until every member finishes, then starts the next group. The trouble is that answers differ in length. A 3-token answer sits in its slot doing nothing while a 14-token answer finishes.</p>
  <p><strong>Continuous batching</strong> (also called in-flight or iteration-level batching) schedules at every decode step. The moment a request finishes, a waiting request takes its slot. Throughput rises and waiting requests start sooner.</p>`,
  hint:'Press Play. Each bar is one request decoding in a batch slot. Watch the gray idle space in static batching.',
  mount(el,c){
    let seed=5, slots=4, jobs, S, C, T=0, run=null;
    el.innerHTML=`<div class="controls" style="margin-top:0">
        <div class="ctl" style="max-width:14rem"><label>Batch slots <output data-so>4</output></label><input type="range" min="2" max="6" step="1" value="4" data-s></div>
        <div class="row"><button class="btn" data-play>Play</button><button class="btn-ghost" data-step>One step</button><button class="btn-ghost" data-reset>Reset</button><button class="btn-ghost" data-shuffle>New request lengths</button></div>
      </div>
      <div data-panels></div>
      <p class="msg" data-msg></p>`;
    const build=()=>{ jobs=Batch.jobs(seed); S=Batch.staticSchedule(jobs,slots); C=Batch.continuousSchedule(jobs,slots); T=0; draw(); };
    const maxT=()=>Math.max(S.makespan,C.makespan);
    const panel=(name,sch,isStatic)=>{
      const M=maxT(), W=640, L=56, R=8, rowH=26, top=18, H=top+slots*rowH+22, sc=(W-L-R)/M;
      let s=`<svg viewBox="0 0 ${W} ${H}" aria-label="${name} timeline">`;
      for(let k=0;k<slots;k++){ s+=`<text x="${L-8}" y="${top+k*rowH+rowH/2+4}" font-size="11" text-anchor="end">slot ${k+1}</text><rect x="${L}" y="${top+k*rowH+2}" width="${(Math.min(T,sch.makespan)*sc).toFixed(1)}" height="${rowH-4}" rx="4" style="fill:var(--ink-3);fill-opacity:.22"/>`; }
      if(isStatic){ const ends=[...new Set(sch.items.map(i=>i.batchEnd))]; ends.forEach(e=>{ if(e<=T) s+=`<line x1="${L+e*sc}" y1="${top-4}" x2="${L+e*sc}" y2="${top+slots*rowH}" style="stroke:var(--ink-2);stroke-width:1.5;stroke-dasharray:4 3"/>`; }); }
      sch.items.forEach(it=>{ if(it.start>=T) return; const w=(Math.min(it.end,T)-it.start)*sc; s+=`<rect x="${(L+it.start*sc+1).toFixed(1)}" y="${top+it.slot*rowH+2}" width="${Math.max(0,w-2).toFixed(1)}" height="${rowH-4}" rx="4" style="fill:${reqColor(it.id)}"/>`; if(w>20) s+=`<text x="${(L+it.start*sc+6).toFixed(1)}" y="${top+it.slot*rowH+rowH/2+4}" font-size="11" style="fill:#0F172A;font-weight:700">R${it.id}</text>`; });
      s+=`<line x1="${L+T*sc}" y1="${top-6}" x2="${L+T*sc}" y2="${top+slots*rowH+2}" style="stroke:var(--ink);stroke-width:2"/><text x="${L}" y="${H-4}" font-size="11">step 0</text><text x="${W-R}" y="${H-4}" font-size="11" text-anchor="end">step ${M}</text></svg>`;
      const m=Batch.metrics(sch,jobs,slots,T);
      return `<div class="bpanel"><div class="row" style="justify-content:space-between"><h3 class="subh" style="margin:0">${name}</h3><span class="muted num">finishes at step ${sch.makespan}</span></div>${s}
        <div class="row" style="gap:1rem"><div style="flex:1;min-width:12rem"><small class="muted">GPU slot utilization so far</small><div class="meter"><span style="width:${(m.util*100).toFixed(1)}%">${Math.round(m.util*100)}%</span></div></div>
        <div class="stat"><span>Finished</span><strong>${m.done} of ${jobs.length}</strong></div><div class="stat"><span>Avg. completion step</span><strong>${m.done?fmt(m.avgLatency,1):'–'}</strong></div></div></div>`;
    };
    const draw=()=>{ $('[data-panels]',el).innerHTML=panel('Static batching',S,true)+panel('Continuous batching',C,false);
      $('[data-msg]',el).innerHTML = T>=maxT() ? `<b>Done.</b> Same ${jobs.reduce((a,j)=>a+j.len,0)} tokens of work. Continuous batching finished ${S.makespan-C.makespan} steps sooner and averaged ${fmt(Batch.metrics(S,jobs,slots).avgLatency-Batch.metrics(C,jobs,slots).avgLatency,1)} steps less per request.` : `Step ${T}. Dashed lines mark where a static batch ends and the next can start.`; };
    const stop=()=>{ if(run){c.stop(run);run=null} $('[data-play]',el).textContent='Play'; };
    $('[data-play]',el).onclick=()=>{ if(run){stop();return} if(T>=maxT()) T=0; $('[data-play]',el).textContent='Pause'; run=c.every(()=>{ T++; draw(); if(T>=maxT()) stop(); },260); };
    $('[data-step]',el).onclick=()=>{ stop(); if(T<maxT()){T++;draw()} };
    $('[data-reset]',el).onclick=()=>{ stop(); T=0; draw(); };
    $('[data-shuffle]',el).onclick=()=>{ stop(); seed=(seed*31+7)%997; build(); };
    $('[data-s]',el).oninput=e=>{ stop(); slots=+e.target.value; $('[data-so]',el).textContent=slots; build(); };
    build();
  },
  prod:'Continuous batching is the default in every modern LLM server and is often the single biggest throughput win, frequently several times over static batching. It also explains why your API latency depends on other people\'s traffic: you share decode steps with everyone else in the batch.',
  quiz:[
    {q:'The main waste in static batching is:',o:['Slots that finished early sit idle until the longest request in the batch ends','Requests are processed twice','The batch uses too little memory','Tokens are sampled greedily'],a:0,why:'The batch moves at the pace of its slowest member.'},
    {q:'Continuous batching decides which requests to run:',o:['Once per hour','Once per batch','At every decode step','Only when the GPU is empty'],a:2,why:'Iteration-level scheduling lets a new request join the moment a slot frees up.'},
    {q:'Why does batching raise throughput so much during decode?',o:['It makes each token\'s math cheaper','One read of the weights from memory is shared across many requests','It shortens the prompts','It reduces the vocabulary size'],a:1,why:'Decode is memory-bound. Batching turns one weight read into many tokens of useful work.'}
  ]
};
/* ===== Module 13: Making inference faster ===== */

    <rect x="500" y="62" width="122" height="80" rx="10" style="fill:rgba(45,212,191,.16);stroke:var(--viz-4);stroke-width:2"/><text x="561" y="84" font-size="12" text-anchor="middle">SRAM (fast)</text>
    <rect x="516" y="94" width="20" height="20" rx="3" style="fill:var(--viz-4)"/><rect x="540" y="94" width="20" height="20" rx="3" style="fill:var(--viz-4);opacity:.7"/><rect x="564" y="94" width="20" height="20" rx="3" style="fill:var(--viz-4);opacity:.45"/><rect x="588" y="94" width="20" height="20" rx="3" style="fill:var(--viz-4);opacity:.25"/>
    <text x="561" y="132" font-size="10" text-anchor="middle">tiles, one at a time</text>
    <path d="M448,102 L498,102" style="fill:none;stroke:var(--viz-4);stroke-width:2.5"/><text x="473" y="94" font-size="10" text-anchor="middle">once</text>
  </svg>
  <p><strong>Quantization</strong> stores weights with fewer bits. FP16 uses 16 bits per weight, INT8 uses 8, INT4 uses 4. Each value is rounded to the nearest of a few levels, scaled by a factor stored alongside. Halving the bits halves memory and, since decode is memory-bound, speeds it up too. The cost is rounding error, which methods such as GPTQ and AWQ keep small.</p>
  <p><strong>Speculative decoding</strong> pairs the big model with a small, fast <strong>draft</strong> model. The draft guesses the next k tokens. The big model checks all k in a single forward pass (checking in parallel is cheap, like prefill). It keeps the guesses up to the first mistake, then adds one token of its own. The output is identical to what the big model would have written alone, just produced in fewer slow steps.</p>`,
  hint:'Slide the precision to see memory shrink and error grow. Then run speculative decoding and watch drafts get accepted or rejected.',
  mount(el,c){
    const ws=Quant.weights();
    const PREC=[{n:'FP32',b:32},{n:'FP16',b:16},{n:'INT8',b:8},{n:'INT4',b:4},{n:'INT2',b:2}];
    const TARGET='The quick review found that the new cache layer cut median latency by forty percent while keeping accuracy flat across every benchmark we ran this week'.split(' ');
    const WRONG=['a','big','slow','old','report','system','raised','mean','cost','sixty','but','losing','quality','some','tests','they','tried','last','month'];
    el.innerHTML=`<h3 class="subh" style="margin-top:0">Quantization</h3>
      <div class="controls" style="margin-top:0">
        <div class="ctl"><label>Model</label><select data-m><option value="7">7B parameters</option><option value="13">13B parameters</option><option value="70" selected>70B parameters</option></select></div>
        <div class="ctl"><label>Precision <output data-po></output></label><input type="range" min="0" max="4" step="1" value="1" data-p></div>
      </div>
      <div class="stats"><div class="stat"><span>Weight memory</span><strong data-mem></strong></div><div class="stat"><span>Saved vs FP16</span><strong data-sav></strong></div><div class="stat"><span>Fits on</span><strong data-fit></strong></div><div class="stat"><span>Avg. rounding error</span><strong data-err></strong></div></div>
      <div><small class="muted">Precision loss on these 16 sample weights</small><div class="meter warnm"><span data-errm></span></div></div>
      <svg viewBox="0 0 640 170" data-w aria-label="Original versus quantized weights" style="margin-top:.75rem"></svg>
      <p class="muted" style="font-size:.85rem;margin:0">Circles: original weights. Bars: the value after rounding to the nearest level and scaling back. Gaps between them are the error.</p>
      <h3 class="subh">Speculative decoding</h3>
      <div class="controls" style="margin-top:0">
        <div class="ctl"><label>Draft length k <output data-ko>4</output></label><input type="range" min="1" max="6" step="1" value="4" data-k></div>
        <div class="ctl"><label>Draft acceptance rate <output data-ao>80%</output></label><input type="range" min="0.5" max="0.95" step="0.05" value="0.8" data-a></div>
        <div class="row"><button class="btn" data-run>Run one round</button><button class="btn-ghost" data-auto>Auto</button><button class="btn-ghost" data-sreset>Reset</button></div>
      </div>
      <div class="draft" data-draft aria-live="polite"></div>
      <div class="stream" data-out></div>
      <div class="stats"><div class="stat"><span>Big-model passes</span><strong data-pass>0</strong></div><div class="stat"><span>Tokens written</span><strong data-tok>0</strong></div><div class="stat"><span>Tokens per pass</span><strong data-tpp>–</strong></div><div class="stat"><span>Expected speed-up</span><strong data-sp></strong></div></div>
      <p class="muted" style="font-size:.85rem;margin:0">Speed-up assumes the draft model costs a tenth of the big model per token. Without speculation, every token needs its own big-model pass.</p>`;
    // quantization
    const M=$('[data-m]',el), P=$('[data-p]',el), wsvg=$('[data-w]',el);
    const drawQ=()=>{
      const pr=PREC[+P.value], params=+M.value*1e9, bytes=params*pr.b/8, gb=bytes/1e9;
      $('[data-po]',el).textContent=pr.n;
      $('[data-mem]',el).textContent=fmt(gb,gb<10?1:0)+' GB';
      const s16=params*2/1e9; $('[data-sav]',el).textContent= pr.b>=16 ? (pr.b===32?`uses 2×`:'baseline') : Math.round((1-gb/s16)*100)+'% less';
      $('[data-fit]',el).textContent= gb<=24 ? 'one 24 GB GPU' : gb<=80 ? 'one 80 GB GPU' : Math.ceil(gb/80)+' × 80 GB GPUs';
      const q=Quant.quantize(ws,pr.b), rel=Quant.relError(ws,pr.b);
      $('[data-err]',el).textContent= pr.b>=16 ? '≈ 0%' : (rel*100).toFixed(1)+'%';
      const em=$('[data-errm]',el); em.textContent= pr.b>=16?'negligible': rel<.02?'tiny': rel<.12?'small': rel<.3?'noticeable':'severe';
      em.style.width = (pr.b>=16?2:Math.min(100,rel/0.7*100)).toFixed(1)+'%';
      const W=640,H=170,L=10,mid=85,sc=900, step=(W-2*L)/ws.length;
      let s=`<line class="ax" x1="${L}" y1="${mid}" x2="${W-L}" y2="${mid}"/>`;
      if(q.scale){ const lv=Math.pow(2,pr.b-1); for(let v=-lv; v<=lv-1; v++){ const y=mid-v*q.scale*sc; if(y>4&&y<H-4&&pr.b<=4) s+=`<line x1="${L}" y1="${y.toFixed(1)}" x2="${W-L}" y2="${y.toFixed(1)}" style="stroke:var(--grid);stroke-dasharray:2 4"/>`; } }
      ws.forEach((w,i)=>{ const x=L+step*i+step/2, d=q.deq[i];
        s+=`<rect x="${(x-9).toFixed(1)}" y="${Math.min(mid,mid-d*sc).toFixed(1)}" width="18" height="${Math.max(1,Math.abs(d*sc)).toFixed(1)}" rx="3" style="fill:var(--viz-1);opacity:.8"/>`;
        s+=`<line x1="${x}" y1="${(mid-w*sc).toFixed(1)}" x2="${x}" y2="${(mid-d*sc).toFixed(1)}" style="stroke:var(--neg);stroke-width:2"/>`;
        s+=`<circle cx="${x}" cy="${(mid-w*sc).toFixed(1)}" r="5" style="fill:var(--card);stroke:var(--viz-2);stroke-width:2.5"/>`; });
      wsvg.innerHTML=s;
    };
    M.onchange=drawQ; P.oninput=drawQ; drawQ();
    // speculative decoding
    const K=$('[data-k]',el), A=$('[data-a]',el); let rnd=mulberry32(42), pos=0, passes=0, auto=null;
    const spStats=()=>{ $('[data-ko]',el).textContent=K.value; $('[data-ao]',el).textContent=Math.round(+A.value*100)+'%';
      $('[data-sp]',el).textContent=fmt(Spec.speedup(+A.value,+K.value),2)+'×'; $('[data-pass]',el).textContent=passes; $('[data-tok]',el).textContent=pos; $('[data-tpp]',el).textContent=passes?fmt(pos/passes,2):'–';
      $('[data-out]',el).textContent=TARGET.slice(0,pos).join(' ')+(pos>=TARGET.length?' ✓ done':''); };
    const round=()=>{
      if(pos>=TARGET.length){ stopAuto(); return; }
      const k=Math.min(+K.value, TARGET.length-pos), r=Spec.round(+A.value,k,rnd); passes++;
      let html='<span class="muted" style="margin-right:.4rem">Draft:</span>';
      for(let i=0;i<k;i++){ const tw=TARGET[pos+i]; if(tw===undefined) break;
        if(i<r.accepted) html+=`<span class="dtok ok">${esc(tw)}</span>`;
        else if(i===r.rejectedAt) html+=`<span class="dtok bad">${esc(WRONG[(pos+i)%WRONG.length])}</span>`;
        else html+=`<span class="dtok gone">…</span>`; }
      const gained=Math.min(TARGET.length-pos, r.accepted+1);
      const fix=TARGET[pos+r.accepted];
      html+=`<span class="muted" style="margin:0 .4rem">Big model:</span>`+(fix!==undefined?`<span class="dtok fix">${esc(fix)}</span>`:'');
      html+=`<span class="muted" style="margin-left:.5rem">${r.rejectedAt<0?(fix!==undefined?`all ${k} accepted, plus one bonus token`:`all ${k} accepted, end of text`):`${r.accepted} accepted, then corrected`}</span>`;
      $('[data-draft]',el).innerHTML=html; pos+=gained; spStats();
    };
    const stopAuto=()=>{ if(auto){c.stop(auto);auto=null} $('[data-auto]',el).textContent='Auto'; };
    $('[data-run]',el).onclick=()=>{stopAuto();round()};
    $('[data-auto]',el).onclick=()=>{ if(auto){stopAuto();return} if(pos>=TARGET.length){pos=0;passes=0} $('[data-auto]',el).textContent='Pause'; auto=c.every(round,700); };
    $('[data-sreset]',el).onclick=()=>{ stopAuto(); rnd=mulberry32(42); pos=0; passes=0; $('[data-draft]',el).innerHTML=''; spStats(); };
    [K,A].forEach(x=>x.oninput=spStats);
    spStats();
  },
  prod:'These stack. A typical production setup runs FlashAttention kernels, 8-bit or 4-bit weights, and speculative decoding or a similar multi-token method. Quantization is often the cheapest win: a 70B model that needs two 80 GB GPUs in FP16 fits on one in INT8. Always re-run your own evals after quantizing, because the quality loss shows up unevenly across tasks.',
  quiz:[
    {q:'FlashAttention speeds up attention by:',o:['Approximating attention with fewer tokens','Computing in tiles in fast on-chip memory, avoiding writing the full score matrix to slow memory','Skipping the softmax','Using a smaller model'],a:1,why:'It is exact attention, reorganized to cut memory traffic. The output matches standard attention.'},
    {q:'Moving a 70B model from FP16 to INT4 changes weight memory from about 140 GB to about:',o:['70 GB','35 GB','14 GB','4 GB'],a:1,why:'4 bits is a quarter of 16 bits. 140 GB ÷ 4 = 35 GB.'},
    {q:'In speculative decoding, the final output compared with the big model alone is:',o:['Lower quality but faster','Identical in distribution, just faster','Written entirely by the draft model','Shorter'],a:1,why:'The big model verifies every token and replaces the first wrong guess, so nothing it wouldn\'t have produced gets through.'}
  ]
};

/* ===== Module 14: Model architectures at scale ===== */
MODULES[14] = {
  intro:`<p>In a <strong>dense</strong> model, every parameter is used for every token. Make the model twice as big and every token costs twice as much compute.</p>
  <p>A <strong>Mixture of Experts (MoE)</strong> model replaces each feed-forward layer with several smaller <strong>experts</strong> plus a tiny <strong>router</strong>. For each token, the router scores every expert and sends the token to only the top few (often 2). The other experts are skipped.</p>
  <p>That splits model size into two numbers. <strong>Total parameters</strong> set how much the model can know, and how much memory it needs. <strong>Active parameters</strong> set the compute per token, and so the speed. Mixtral 8x7B has about 47B total but only about 13B active per token. Training adds a load-balancing loss so the router doesn't overload a few favorite experts.</p>`,
  hint:'Click any token to see how the router scores the experts, or route the whole sentence and watch the load build up.',
  mount(el,c){
    let k=2, sel=0, loads=new Array(8).fill(0), routed=new Set(), anim=null;
    el.innerHTML=`<div class="controls" style="margin-top:0"><div class="ctl" style="flex:0 1 auto"><label>Experts per token (top-k)</label><div class="row">${[1,2,3].map(n=>`<button class="btn-ghost" data-k="${n}" aria-pressed="${n===2}">${n}</button>`).join('')}</div></div>
      <div class="row"><button class="btn" data-all>Route all tokens</button><button class="btn-ghost" data-reset>Clear load</button></div></div>
      <div class="sent" data-toks></div>
      <div class="experts" data-ex></div>
      <p class="msg" data-msg></p>
      <div class="stats"><div class="stat"><span>Total parameters</span><strong data-tot></strong></div><div class="stat"><span>Active per token</span><strong data-act></strong></div><div class="stat"><span>Compute vs a dense model of the same size</span><strong data-ratio></strong></div></div>
      <p class="muted" style="font-size:.85rem;margin:0">Parameter counts use a Mixtral-like split: about 1.6B shared (attention, embeddings) plus 8 experts of about 5.6B each. Expert specialties are labeled for teaching. Real experts specialize in less tidy ways.</p>`;
    const draw=()=>{
      const r=MoE.route(sel,k);
      $('[data-toks]',el).innerHTML=MoE.SENT.map(([t],i)=>`<button class="wtok${i===sel?' qsel':''}" data-i="${i}" style="${routed.has(i)?'':'opacity:.85'}"><span>${esc(t)}</span></button>`).join('');
      const mxL=Math.max(1,...loads);
      $('[data-ex]',el).innerHTML=MoE.EXPERTS.map((name,e)=>{ const on=r.top.indexOf(e); return `<div class="expert${on>=0?' on':''}"><b>Expert ${e+1}</b><span>${name}</span>
        <div class="meter thin"><span style="width:${(r.p[e]*100).toFixed(1)}%"></span></div><small class="num">router ${Math.round(r.p[e]*100)}%${on>=0?`, gate ${Math.round(r.gates[on]*100)}%`:''}</small>
        <div class="load"><span style="width:${(loads[e]/mxL*100).toFixed(1)}%"></span></div><small class="muted num">${loads[e]} tokens routed</small></div>`; }).join('');
      $('[data-msg]',el).innerHTML=`Token <b>${esc(MoE.SENT[sel][0])}</b> goes to ${r.top.map((e,j)=>`expert ${e+1} (${MoE.EXPERTS[e].toLowerCase()}, weight ${Math.round(r.gates[j]*100)}%)`).join(' and ')}. The other ${8-k} experts do no work for it. Their outputs are mixed using the gate weights.`;
      const p=MoE.params(8,k); $('[data-tot]',el).textContent=fmt(p.total,1)+'B'; $('[data-act]',el).textContent=fmt(p.active,1)+'B'; $('[data-ratio]',el).textContent=Math.round(p.active/p.total*100)+'%';
    };
    const routeOne=i=>{ if(routed.has(i)) return; MoE.route(i,k).top.forEach(e=>loads[e]++); routed.add(i); };
    const stop=()=>{ if(anim){c.stop(anim);anim=null} $('[data-all]',el).textContent='Route all tokens'; };
    $('[data-toks]',el).onclick=e=>{ const b=e.target.closest('[data-i]'); if(!b) return; sel=+b.dataset.i; routeOne(sel); draw(); };
    $('[data-all]',el).onclick=()=>{ if(anim){stop();return} loads.fill(0); routed.clear(); let i=0; $('[data-all]',el).textContent='Pause';
      anim=c.every(()=>{ sel=i; routeOne(i); draw(); i++; if(i>=MoE.SENT.length){ stop(); const mx=Math.max(...loads), mn=Math.min(...loads); $('[data-msg]',el).innerHTML+=` <b>All ${MoE.SENT.length} tokens routed.</b> The busiest expert got ${mx} tokens, the quietest ${mn}. Uneven load wastes hardware, which is why training adds a load-balancing loss.`; } },320); };
    $('[data-reset]',el).onclick=()=>{ stop(); loads.fill(0); routed.clear(); draw(); };
    $$('[data-k]',el).forEach(b=>b.onclick=()=>{ k=+b.dataset.k; $$('[data-k]',el).forEach(x=>x.setAttribute('aria-pressed',String(x===b))); stop(); loads.fill(0); routed.clear(); draw(); });

  prod:'MoE models give you big-model quality at closer to small-model speed per token, which is why many frontier and open models use them. The catch is memory: every expert must be loaded even though only a few run, so an MoE needs as much GPU memory as a dense model of its total size. Budget hardware by total parameters and latency by active parameters.',

/* ===== Module 15: Prompting and context ===== */

  intro:`<p>A prompt is the model's entire world for that request. It doesn't remember earlier chats or know your company unless that text is in the context.</p>
  <p>Most APIs separate a <strong>system prompt</strong> (role, rules, tone, output format, set by the developer) from <strong>user messages</strong>. A few habits reliably improve results: say exactly what you want and why, specify the output format, show a handful of <strong>few-shot examples</strong>, and for multi-step problems ask the model to reason step by step before answering (<strong>chain of thought</strong>).</p>
  <p>The <strong>context window</strong> is the maximum number of tokens a model can take in at once, prompt plus output. Bigger isn't free: cost and latency grow with length, and models tend to use information at the start and end of a long context better than information buried in the middle, a pattern known as <strong>lost in the middle</strong>.</p>`,

/* ===== Module 16: RAG ===== */
MODULES[16] = {
  intro:`<p>An LLM only knows what was in its training data, up to a cutoff date. Ask about your company's travel policy or yesterday's incident and it will either refuse or, worse, <strong>hallucinate</strong> a plausible-sounding answer. Fine-tuning doesn't reliably fix this and goes stale the moment the data changes.</p>
  <p><strong>Retrieval-augmented generation (RAG)</strong> looks up the relevant facts at question time and puts them in the prompt.</p>
  <ol class="pipeline">
    <li><b>Chunk</b><span>Split documents into passages of a few sentences.</span></li>
    <li><b>Embed</b><span>Turn each chunk into a vector (see Embeddings and vectors).</span></li>
    <li><b>Store</b><span>Save the vectors in a vector index or database.</span></li>
    <li><b>Search</b><span>Embed the question and find the most similar chunks.</span></li>
    <li><b>Re-rank</b><span>Re-score the candidates with a slower, sharper model.</span></li>
    <li><b>Stuff the prompt</b><span>Put the top chunks, numbered, into the prompt.</span></li>
    <li><b>Generate</b><span>The model answers from those chunks and cites them.</span></li>
  </ol>`,
  hint:'Pick a question or type your own. Change the chunk size and top-k, and watch which chunks make it into the prompt.',
  illustrative:true,
  mount(el){
    const DOC=`Northwind Labs travel and expense policy, updated March 2026. All business trips must be approved by your manager before booking. Book flights through the Northwind travel portal at least 14 days before departure when possible. Economy class is required for flights under six hours. Business class is allowed for flights longer than six hours with director approval. Hotel limits depend on the city. The nightly hotel limit is $250 in New York, £200 in London, ₹9,000 in Hyderabad and $180 in all other cities. Meals are covered up to $75 per day, including tips. Alcohol is not reimbursable. Ride shares and taxis are covered for business travel, but personal side trips are not. Rental cars need prior approval and must be compact class unless five or more employees travel together. Submit all expenses within 30 days of returning, with itemized receipts for anything over $25. Late submissions over 60 days are not reimbursed. For international trips, the company pays for travel insurance and required visas. Questions go to the travel help desk.`;
    const QS=['What is the hotel limit in London?','How soon must I submit expenses?','Can I fly business class?','Who pays for visas on international trips?','Is wine covered with dinner?'];
    el.innerHTML=`<label class="muted" for="rag-doc" style="font-size:.85rem">Your document (a fictional company policy the model has never seen)</label>
      <textarea id="rag-doc" rows="5" data-doc></textarea>
      <div class="controls">
        <div class="ctl"><label>Chunk size, words <output data-zo></output></label><input type="range" min="15" max="120" step="5" value="30" data-z></div>
        <div class="ctl"><label>Overlap, sentences <output data-oo></output></label><input type="range" min="0" max="2" step="1" value="1" data-o></div>
        <div class="ctl"><label>Top-k chunks <output data-ko></output></label><input type="range" min="1" max="5" step="1" value="3" data-k></div>
        <div class="ctl" style="flex:0 1 auto"><label>Re-ranker</label><button class="btn-ghost" data-rr aria-pressed="false">Off</button></div>
      </div>
      <label class="muted" for="rag-q" style="font-size:.85rem">Question</label>
      <input type="text" id="rag-q" data-q style="width:100%">
      <div class="row" style="margin:.6rem 0 1rem">${QS.map((q,i)=>`<button class="chip" data-qs="${i}">${esc(q)}</button>`).join('')}</div>
      <h3 class="subh" style="margin-top:0">Retrieved chunks, scored against the question</h3>
      <div class="chunks" data-chunks></div>
      <div class="split" style="margin-top:1rem">
        <div><h3 class="subh" style="margin-top:0">Prompt sent to the model</h3><pre class="prompt" data-prompt></pre></div>
        <div><h3 class="subh" style="margin-top:0">Answer</h3><div class="answer" data-ans aria-live="polite"></div></div>
      </div>
      <p class="muted" style="font-size:.85rem">Similarity here is real math on word-weight vectors (TF-IDF), a simple stand-in for a neural embedding model. The answer is extracted from the top chunks to mimic a grounded model.</p>`;
    const D=$('[data-doc]',el), Q=$('[data-q]',el), Z=$('[data-z]',el), O=$('[data-o]',el), K=$('[data-k]',el), RR=$('[data-rr]',el);
    D.value=DOC; Q.value=QS[0]; let rerank=false;
    const draw=()=>{
      $('[data-zo]',el).textContent=Z.value; $('[data-oo]',el).textContent=O.value; $('[data-ko]',el).textContent=K.value;
      const res=RAG.retrieve(D.value,Q.value,{size:+Z.value,overlap:+O.value,k:+K.value,rerank});
      if(!res.chunks.length){ $('[data-chunks]',el).innerHTML='<p class="muted">Add a document and a question to start.</p>'; $('[data-prompt]',el).textContent=''; $('[data-ans]',el).textContent=''; return; }
      const topIds=new Set(res.top.map(t=>t.i)); const mx=Math.max(0.01,...res.chunks.map(x=>rerank?x.rerank:x.score));
      const order=res.ranked;
      $('[data-chunks]',el).innerHTML=order.map(ch=>{ const v=rerank?ch.rerank:ch.score; const inP=topIds.has(ch.i); const cite=inP?res.top.findIndex(t=>t.i===ch.i)+1:null;
        return `<div class="chunk${inP?' in':''}"><div class="chunk-h"><span class="num">#${ch.rank+1}</span><span class="muted">chunk ${ch.i+1}</span>${inP?`<span class="tagp">in prompt as [${cite}]</span>`:''}<span class="num" style="margin-left:auto">${rerank?`vector ${fmt(ch.score)}, re-ranked ${fmt(ch.rerank)}`:`similarity ${fmt(ch.score)}`}</span></div>
          <div class="meter thin"><span style="width:${(Math.max(0,v)/mx*100).toFixed(1)}%"></span></div><p>${esc(ch.text)}</p></div>`; }).join('');
      $('[data-prompt]',el).textContent=`System: Answer using only the sources below. Cite sources like [1]. If the sources don't contain the answer, say you don't know.\n\n`+
        (res.top.length?res.top.map((t,i)=>`[${i+1}] ${t.text}`).join('\n\n'):'(no chunk scored above zero)')+`\n\nQuestion: ${Q.value}`;
      const a=RAG.answer(Q.value,res.top);
      $('[data-ans]',el).innerHTML = a ? `<p>${esc(a.sent)} <span class="cite">[${a.cite}]</span></p><p class="muted" style="font-size:.85rem;margin:0">Grounded in chunk ${res.top[a.cite-1].i+1}. Without retrieval, the model has never seen this policy and would have to guess.</p>`
        : `<p>I don't know based on the provided sources.</p><p class="muted" style="font-size:.85rem;margin:0">The retrieved chunks don't contain enough matching information. ${/wine/i.test(Q.value)?'The policy says "Alcohol is not reimbursable", but "wine" and "alcohol" share no words, so word-based vectors miss it. Neural embeddings and hybrid search (see Advanced RAG) handle this better.':'Try a different question, a bigger top-k or a different chunk size.'} Refusing beats hallucinating.</p>`;
    };
    let t=null; const deb=()=>{ clearTimeout(t); t=setTimeout(draw,150); };
    D.oninput=deb; Q.oninput=deb; [Z,O,K].forEach(x=>x.oninput=draw);
    RR.onclick=()=>{ rerank=!rerank; RR.setAttribute('aria-pressed',String(rerank)); RR.textContent=rerank?'On':'Off'; draw(); };
    $$('[data-qs]',el).forEach(b=>b.onclick=()=>{ Q.value=QS[+b.dataset.qs]; draw(); });
    draw();
  },
  prod:'Most RAG failures are retrieval failures, not model failures. If the right chunk never reaches the prompt, no model can answer correctly. Tune chunking, measure retrieval recall on real questions, and keep citations so users and evaluators can check answers. Telling the model to say "I don\'t know" when sources are silent is your first line of defense against hallucination.',
  quiz:[
    {q:'Why does RAG reduce hallucination on private or recent data?',o:['It makes the model larger','It puts the relevant facts into the prompt at question time','It lowers the temperature','It retrains the model on every question'],a:1,why:'The model answers from text it can see, instead of from what it vaguely remembers or invents.'},
    {q:'Chunks that are much too large tend to:',o:['Improve precision','Dilute the similarity score with unrelated content and waste context tokens','Make embedding impossible','Remove the need for top-k'],a:1,why:'One relevant sentence in a long chunk gets drowned out, and stuffing big chunks eats the context window.'},
    {q:'The right chunk exists in your index, but the model still answers wrongly. The first thing to check is:',o:['Whether the chunk was actually retrieved into the prompt','The model\'s parameter count','The tokenizer\'s vocabulary','The GPU type'],a:0,why:'Check retrieval first. If the chunk never reached the prompt, the generator never had a chance.'}
  ]
};

/* ===== Module 17: Advanced RAG ===== */
MODULES[17] = {
  intro:`<p>Basic RAG fails in predictable ways, and each failure has a standard fix.</p>
  <ul>
    <li><strong>Hybrid search.</strong> Vector search understands meaning but blurs exact strings like error codes, SKUs and names. Keyword search (<strong>BM25</strong>, the classic ranking formula behind search engines) nails exact terms but misses paraphrases. Run both and merge the rankings, often with <strong>reciprocal rank fusion</strong>: each document scores 1 ÷ (60 + its rank) in each list, summed.</li>
    <li><strong>Query rewriting.</strong> Users type short, vague questions. Have an LLM rewrite them into fuller search queries, or generate several variants, before retrieving.</li>
    <li><strong>Re-rankers.</strong> Retrieve 50 candidates cheaply, then score each against the question with a cross-encoder or LLM that reads both together. Slower, much sharper.</li>
    <li><strong>GraphRAG.</strong> Extract entities and relationships into a knowledge graph so the system can answer questions that span many documents ("which teams depend on the billing service?").</li>
    <li><strong>Evaluation.</strong> Measure retrieval and generation separately. <strong>Recall@k</strong>: did the right chunks make the top k? <strong>Faithfulness</strong>: is every claim in the answer supported by the retrieved text?</li>
  </ul>`,
  hint:'Pick a query and compare the three result lists. Then turn on query rewriting and watch recall change.',
  mount(el){
    let qi=1, rewrite=false;
    el.innerHTML=`<div class="row" style="margin-bottom:.75rem">${Hybrid.QUERIES.map((q,i)=>`<button class="chip" data-q="${i}">${esc(q.q)}</button>`).join('')}</div>
      <div class="row" style="margin-bottom:.5rem"><button class="btn-ghost" data-rw aria-pressed="false">Query rewriting off</button><span class="muted" data-qtext style="flex:1;min-width:12rem"></span></div>
      <p class="msg" data-note style="margin-top:0"></p>
      <div class="cols3" data-cols></div>
      <div class="stats" data-recall></div>
      <p class="muted" style="font-size:.85rem;margin:0">Green rows are the documents a human marked as relevant. Keyword scores are real BM25. Vector search uses a small hand-built concept map in place of a neural embedding model. Hybrid is real reciprocal rank fusion of the two lists.</p>`;
    const draw=()=>{
      const Q=Hybrid.QUERIES[qi], text=rewrite?Q.rewrite:Q.q, r=Hybrid.run(text), rel=new Set(Q.rel);
      $$('[data-q]',el).forEach(b=>b.setAttribute('aria-pressed',String(+b.dataset.q===qi)));
      $('[data-qtext]',el).innerHTML=rewrite?`Searching for: <b>${esc(text)}</b>`:`Searching for the raw question.`;
      $('[data-note]',el).textContent=Q.note;
      const col=(name,list,fmtS)=>`<div class="rcol"><h3 class="subh" style="margin:0 0 .5rem">${name}</h3>${list.slice(0,5).map((x,ri)=>`<div class="rrow${rel.has(x.i)?' rel':''}${x.score<=0?' zero':''}"><span class="num">${ri+1}</span><span class="rt">${esc(Hybrid.TITLES[x.i])}</span><span class="num muted">${x.score>0?fmtS(x.score):'no match'}</span></div>`).join('')}</div>`;
      $('[data-cols]',el).innerHTML=col('Keyword (BM25)',r.kw,v=>fmt(v,1))+col('Vector',r.vec,v=>fmt(v))+col('Hybrid (RRF)',r.hy,v=>fmt(v*1000,1));
      const rc=[['Keyword recall@3',Hybrid.recall(r.kw,Q.rel)],['Vector recall@3',Hybrid.recall(r.vec,Q.rel)],['Hybrid recall@3',Hybrid.recall(r.hy,Q.rel)]];
      $('[data-recall]',el).innerHTML=rc.map(([l,v])=>`<div class="stat"><span>${l}</span><strong>${Math.round(v*100)}%</strong></div>`).join('');
    };
    $$('[data-q]',el).forEach(b=>b.onclick=()=>{qi=+b.dataset.q;draw()});
    $('[data-rw]',el).onclick=e=>{rewrite=!rewrite;e.currentTarget.setAttribute('aria-pressed',String(rewrite));e.currentTarget.textContent=rewrite?'Query rewriting on':'Query rewriting off';draw()};
    draw();
  },
  prod:'Hybrid search is a sensible default for enterprise RAG, because real questions mix exact identifiers with fuzzy wording. Build a small labeled set of real questions with their correct sources, and track recall@k every time you change chunking, embeddings or ranking. Without that, you are tuning blind.',
  quiz:[
    {q:'A user searches for the exact error code "ERR-4031". Which retrieval is most reliable?',o:['Pure vector search','Keyword search such as BM25, or hybrid','Random sampling','A larger LLM with no retrieval'],a:1,why:'Exact strings are what keyword search is built for. Embeddings tend to blur codes and numbers.'},
    {q:'Reciprocal rank fusion combines result lists by:',o:['Averaging raw scores from different systems','Summing 1 ÷ (k + rank) for each document across lists','Keeping only documents found by both','Picking the list with the highest score'],a:1,why:'Using ranks rather than raw scores avoids comparing BM25 numbers with cosine similarities, which live on different scales.'},
    {q:'"Faithfulness" in a RAG evaluation checks whether:',o:['The answer is fast','Every claim in the answer is supported by the retrieved sources','The user was satisfied','The right chunks were in the top k'],a:1,why:'That one is about generation. The top-k question is recall, which is about retrieval.'}

/* ===== Module 18: Tool use and function calling ===== */
MODULES[18] = {
  intro:`<p>On its own, an LLM can only produce text. <strong>Tool use</strong> (also called function calling) lets it act: look up live data, run code, call APIs. The model never executes anything itself. The loop works like this:</p>
  <ol class="steps">
    <li>Your app sends the conversation plus a list of <strong>tool definitions</strong>: a name, a description and a JSON Schema for the inputs.</li>
    <li>If the model decides a tool would help, it replies with a structured <strong>tool call</strong> instead of an answer, and stops.</li>
    <li>Your app validates the arguments, runs the real function, and sends the <strong>tool result</strong> back as a new message.</li>
    <li>The model reads the result and either calls another tool or writes the final answer.</li>
  </ol>
  <p>The quality of tool descriptions matters as much as the prompt. The model picks tools and fills arguments based purely on what you wrote in them.</p>`,
  hint:'Step through each turn and read the raw messages. In the calculator, edit the expression and watch the result flow back.',
  mount(el){
    const CITIES={Hyderabad:{forecast:'thunderstorms',chance_of_rain:0.7,high_c:29,low_c:22},London:{forecast:'light drizzle',chance_of_rain:0.55,high_c:14,low_c:9},'San Diego':{forecast:'sunny',chance_of_rain:0.02,high_c:24,low_c:16}};
    let scen='weather', step=0, city='Hyderabad', expr='2450 * 0.18 + 75';

        <div class="ctl" style="flex:0 1 auto"><label>Scenario</label><div class="row"><button class="btn-ghost" data-sc="weather" aria-pressed="true">Weather</button><button class="btn-ghost" data-sc="calc" aria-pressed="false">Calculator</button></div></div>
        <div class="ctl" data-cityw><label>City</label><select data-city>${Object.keys(CITIES).map(c=>`<option>${c}</option>`).join('')}</select></div>
        <div class="ctl" data-exprw hidden><label>Expression the model sends</label><input type="text" data-expr value="${expr}" spellcheck="false"></div>

      <div class="turn-view" data-view aria-live="polite"></div>
      <div class="row" style="margin-top:1rem"><button class="btn-ghost" data-back>Back</button><button class="btn" data-next>Next turn</button><span class="muted num" data-pos style="margin-left:auto"></span></div>`;

      if(scen==='weather'){

        return [
          {who:'App → model',title:'Tool definitions and user message',body:{model:'any-llm',tools:[{name:'get_weather',description:'Get the forecast for a city on a given day. Use for any weather or what-to-wear question.',input_schema:{type:'object',properties:{location:{type:'string',description:'City name'},date:{type:'string',description:'"today", "tomorrow" or YYYY-MM-DD'}},required:['location']}}],messages:[{role:'user',content:q}]},note:'The model sees the tool\'s name, description and input schema, nothing else.'},
          {who:'Model → app',title:'The model asks for a tool',body:{role:'assistant',stop_reason:'tool_use',content:[{type:'text',text:'Let me check the forecast.'},{type:'tool_use',id:'call_01',name:'get_weather',input:{location:city,date:'tomorrow'}}]},note:'The model stops and hands control back. It has not run anything.'},
          {who:'App',title:'Your code runs the real function',body:`// validate input against the schema, then call your weather API\nconst result = await getWeather(${JSON.stringify(city)}, "tomorrow");\n// → ${JSON.stringify(CITIES[city])}`,code:true,note:'This is where permissions, timeouts and error handling live. Weather values here are illustrative.'},
          {who:'App → model',title:'Tool result goes back into the context',body:{role:'user',content:[{type:'tool_result',tool_use_id:'call_01',content:JSON.stringify(data)}]},note:'The tool_use_id links the result to the call, which matters when the model calls several tools at once.'},
          {who:'Model → app',title:'Final answer',body:{role:'assistant',stop_reason:'end_turn',content:[{type:'text',text: yes?`Yes, take one. ${city} expects ${data.forecast} tomorrow with a ${Math.round(data.chance_of_rain*100)}% chance of rain and a high of ${data.high_c}°C.`:`No need. ${city} looks ${data.forecast} tomorrow with only a ${Math.round(data.chance_of_rain*100)}% chance of rain and a high of ${data.high_c}°C.`}]},note:'stop_reason "end_turn" means the model is done, so your loop can stop.'}
        ];
      }
      let res, err=null; try{ res=calcEval(expr); }catch(e){ err=e.message; }
      const q='What\'s 18% of 2,450, plus a $75 fee?';
      return [
        {who:'App → model',title:'Tool definitions and user message',body:{model:'any-llm',tools:[{name:'calculator',description:'Evaluate an arithmetic expression exactly. Use this instead of doing math in your head.',input_schema:{type:'object',properties:{expression:{type:'string',description:'Arithmetic using + - * / ^ ( ) and %'}},required:['expression']}}],messages:[{role:'user',content:q}]},note:'LLMs are unreliable at exact arithmetic, so a calculator tool is a classic first tool.'},

  illustrative:false,
  prod:'Treat every tool call as untrusted input from the model: validate arguments against the schema, enforce permissions in your code, set timeouts and return clear error messages. Keep the tool list short and the descriptions precise. Ten sharp tools beat fifty vague ones, both for accuracy and for the tokens the definitions cost on every request.',
  quiz:[
    {q:'When a model "calls a tool", who actually executes the function?',o:['The model, inside its neural network','Your application code','The tokenizer','The vector database'],a:1,why:'The model only emits a structured request. Your code decides whether and how to run it.'},
    {q:'What does the model rely on to choose a tool and fill its arguments?',o:['The tool\'s source code','The tool\'s name, description and input schema','The tool\'s execution logs','Nothing, it guesses at random'],a:1,why:'That text is all it sees, so write descriptions the way you would for a new colleague.'},
    {q:'A tool call fails with an error. The best practice is to:',o:['Crash the app','Hide the error and return an empty result','Send the error back as the tool result so the model can adjust','Retry the same call forever'],a:2,why:'Models are good at reading an error and fixing their input. Cap retries in your own loop.'}

/* ===== Module 19: AI agents ===== */
MODULES[19] = {
  intro:`<p>An <strong>agent</strong> is an LLM running tools in a loop until a goal is met. Instead of one call and one answer, it repeats: <strong>observe</strong> the current state, <strong>think</strong> about what to do, <strong>act</strong> with a tool, and feed the result back in.</p>
  <p>The <strong>ReAct</strong> pattern (reason plus act) makes that loop explicit: the model writes a thought, picks an action, reads the observation, and continues. Some agents also write a <strong>plan</strong> up front and revise it as they go.</p>
  <p>Agents need <strong>memory</strong>. Short-term memory is the context window itself, which grows with every step. Long-term memory is an external store (a file, a database, a vector index) that survives between runs. And they need <strong>stopping conditions</strong>: the goal is met, a step or cost budget runs out, or the agent hits something only a human should decide.</p>`,
  hint:'Press Play to watch the agent loop. Then inject a tool failure, or lower the step limit, and run it again.',
  mount(el,c){
    let fail=false, maxSteps=8, i=0, run=null, S=AgentSim.script(false), mem=[];
    el.innerHTML=`<p class="task"><b>Task:</b> ${esc(AgentSim.TASK)}</p>
      <div class="controls" style="margin-top:0">
        <div class="ctl" style="max-width:14rem"><label>Step limit <output data-mo>8</output></label><input type="range" min="3" max="10" step="1" value="8" data-max></div>
        <div class="ctl" style="flex:0 1 auto"><label>Tool failure</label><button class="btn-ghost" data-fail aria-pressed="false">Off</button></div>
        <div class="row"><button class="btn" data-play>Play</button><button class="btn-ghost" data-step>One step</button><button class="btn-ghost" data-reset>Reset</button></div>
      </div>
      <div class="agent-grid">
        <div><h3 class="subh" style="margin-top:0">Scratchpad</h3><ol class="pad" data-pad aria-live="polite"></ol></div>
        <div class="agent-side">
          <div class="stats tight"><div class="stat"><span>Step</span><strong data-st>0</strong></div><div class="stat"><span>Tool calls</span><strong data-tc>0</strong></div><div class="stat"><span>Context tokens</span><strong data-ctx></strong></div></div>
          <small class="muted">Short-term memory (context window)</small><div class="meter"><span data-ctxm></span></div>
          <h3 class="subh">Long-term memory</h3><ul class="memlist" data-mem></ul>
          <h3 class="subh">Status</h3><p class="status" data-status></p>
        </div>
      </div>`;
    const reset=()=>{ S=AgentSim.script(fail); i=0; mem=['Checkout errors normally run 300 to 500 a day']; draw(); };
    const tokens=()=>AgentSim.BASE_TOKENS+S.slice(0,i).reduce((a,s)=>a+s.tok,0);
    const done=()=>i>=S.length, limited=()=>!done()&&i>=maxSteps;
    const draw=()=>{
      $('[data-pad]',el).innerHTML=S.slice(0,i).map((s,k)=>`<li class="${s.fail?'failed':''}"><div class="pl"><span class="tagt">Thought</span>${esc(s.thought)}</div><div class="pl"><span class="tagt act">Action</span><code>${esc(s.tool)}(${esc(JSON.stringify(s.args))})</code></div><div class="pl"><span class="tagt obs">Observation</span><code>${esc(JSON.stringify(s.obs))}</code></div></li>`).join('')+(done()?`<li class="final"><div class="pl"><span class="tagt act">Answer</span>${esc(AgentSim.FINAL)}</div></li>`:'');
      const pad=$('[data-pad]',el); pad.scrollTop=pad.scrollHeight;
      $('[data-st]',el).textContent=`${i} of ${maxSteps}`; $('[data-tc]',el).textContent=i;
      const t=tokens(); $('[data-ctx]',el).textContent=t.toLocaleString(); const m=$('[data-ctxm]',el); m.style.width=Math.min(100,t/2500*100)+'%'; m.textContent=t.toLocaleString();
      $('[data-mem]',el).innerHTML=mem.concat(S.slice(0,i).filter(s=>s.memory).map(s=>s.memory)).map((x,k)=>`<li${k>0?' class="new"':''}>${esc(x)}</li>`).join('');
      $('[data-status]',el).innerHTML = done() ? '<b>Stopped: goal met.</b> All three counts collected, a ticket opened and a note saved.'
        : limited() ? `<b>Stopped: step limit reached.</b> The agent used all ${maxSteps} steps before finishing and should report partial progress instead of guessing.`
        : i===0 ? 'Ready. The context holds the system prompt, tool definitions and the task.' : `Running. Next: ${esc(S[i].tool)}.`;
    };
    const stop=()=>{ if(run){c.stop(run);run=null} $('[data-play]',el).textContent='Play'; };
    const tick=()=>{ if(done()||limited()){stop();return false} i++; draw(); if(done()||limited()){stop();return false} return true; };
    $('[data-play]',el).onclick=()=>{ if(run){stop();return} if(done()||limited()) reset(); $('[data-play]',el).textContent='Pause'; run=c.every(tick,1100); };
    $('[data-step]',el).onclick=()=>{ stop(); tick(); };
    $('[data-reset]',el).onclick=()=>{ stop(); reset(); };
    $('[data-max]',el).oninput=e=>{ maxSteps=+e.target.value; $('[data-mo]',el).textContent=maxSteps; draw(); };
    $('[data-fail]',el).onclick=e=>{ fail=!fail; e.currentTarget.setAttribute('aria-pressed',String(fail)); e.currentTarget.textContent=fail?'On':'Off'; stop(); reset(); };
    reset();
  },
  prod:'Agents trade predictability for flexibility. In production, give them a small set of well-described tools, hard budgets on steps, tokens and time, and a log of every thought and tool call so you can debug runs. Start with a fixed workflow and only add agent autonomy where the steps genuinely can\'t be known in advance.',
  quiz:[
    {q:'What separates an agent from a single LLM call?',o:['It uses a bigger model','It runs tools in a loop, using each result to decide the next step','It never uses tools','It has no context window'],a:1,why:'Observe, think, act, repeat. The loop is the agent.'},
    {q:'In ReAct, each step consists of:',o:['A thought, an action and an observation','Only a final answer','Training and evaluation','Embedding and retrieval'],a:0,why:'The written thought makes the model\'s reasoning visible and steers which action it takes next.'},
    {q:'Why does an agent need a step limit even when it is working well?',o:['To save disk space','To prevent runaway loops and cost when it gets stuck','Because tools only work once','To make the model more creative'],a:1,why:'Without a budget, a confused agent can retry or wander for hundreds of steps.'}
  ]
};

/* ===== Module 20: MCP and agent ecosystems ===== */
MODULES[20] = {
  intro:`<p>Every AI app that wants to use your calendar, your repo or your database needs an integration. Without a standard, each app builds its own connector for each service: M apps × N services integrations.</p>
  <p>The <strong>Model Context Protocol (MCP)</strong> is an open standard that fixes this, often compared to USB-C for AI. Each service is wrapped once as an <strong>MCP server</strong>, and any MCP-compatible app can use it. That turns M × N into M + N.</p>
  <ul>
    <li><strong>Host</strong>: the AI application the user works in, such as a chat app, IDE or agent.</li>
    <li><strong>Client</strong>: a connector inside the host, one per server, that speaks the protocol (JSON-RPC 2.0).</li>
    <li><strong>Server</strong>: a program exposing capabilities, run locally (over stdio) or remotely (over HTTP).</li>
    <li>Servers expose <strong>tools</strong> (actions the model can call), <strong>resources</strong> (data the app can read into context) and <strong>prompts</strong> (reusable templates the user can pick).</li>
  </ul>`,
  hint:'Click a server to see what it exposes and the raw protocol messages. Below, compare integration counts with and without a standard.',
  mount(el){

      {id:'db',name:'Database',transport:'remote, HTTP',tools:[['run_query','Run a read-only SQL query','{"sql": "string"}'],['describe_table','Show columns and types','{"table": "string"}']],resources:['db://schema'],prompts:['explain-query']},
      {id:'cal',name:'Calendar',transport:'remote, HTTP',tools:[['list_events','Events in a date range','{"start": "date", "end": "date"}'],['create_event','Create an event','{"title": "string", "start": "datetime"}'],['find_free_time','Find open slots for attendees','{"attendees": "string[]"}']],resources:['calendar://today'],prompts:['plan-my-week']},
      {id:'fs',name:'File system',transport:'local, stdio',tools:[['read_file','Read a file','{"path": "string"}'],['write_file','Write a file','{"path": "string", "content": "string"}']],resources:['file:///notes/'],prompts:[]}
    ];
    let sel=0;
    el.innerHTML=`<div class="mcp-grid"><svg viewBox="0 0 420 330" data-d aria-label="MCP architecture diagram"></svg><div data-p></div></div>
      <h3 class="subh">Why a standard matters</h3>
      <div class="controls" style="margin-top:0"><div class="ctl"><label>AI apps <output data-ao>5</output></label><input type="range" min="1" max="20" value="5" data-a></div><div class="ctl"><label>Services <output data-so>8</output></label><input type="range" min="1" max="30" value="8" data-s></div></div>
      <div class="stats"><div class="stat"><span>Custom integrations, no standard</span><strong data-mn></strong></div><div class="stat"><span>With MCP</span><strong data-mp></strong></div></div>`;
    const draw=()=>{
      const ys=[40,115,190,265];

        <rect x="22" y="58" width="136" height="44" rx="10" style="fill:rgba(118,97,255,.14);stroke:var(--viz-2);stroke-width:2"/><text x="90" y="85" font-size="12" text-anchor="middle">LLM</text>`;
      SV.forEach((v,i)=>{ const y=ys[i]+40, on=i===sel;
        s+=`<rect x="40" y="${y-14}" width="118" height="28" rx="8" style="fill:var(--card);stroke:${on?'var(--select)':'var(--line)'};stroke-width:2"/><text x="99" y="${y+4}" font-size="11" text-anchor="middle">MCP client ${i+1}</text>
          <line x1="90" y1="102" x2="90" y2="${y-14}" style="stroke:var(--line);stroke-width:2"/>
          <path d="M158,${y} C210,${y} 210,${ys[i]+18} 252,${ys[i]+18}" style="fill:none;stroke:${on?'var(--select)':'var(--ink-3)'};stroke-width:${on?3:2};stroke-dasharray:${v.transport.startsWith('local')?'none':'6 4'}"/>
          <g data-sv="${i}" style="cursor:pointer" tabindex="0" role="button" aria-pressed="${on}" aria-label="${v.name} server"><rect x="252" y="${ys[i]}" width="160" height="36" rx="10" style="fill:${on?'var(--ok-bg)':'var(--card)'};stroke:${on?'var(--ok-line)':'var(--line)'};stroke-width:2"/><text x="332" y="${ys[i]+16}" font-size="12" text-anchor="middle" font-weight="700" style="fill:var(--ink)">${v.name}</text><text x="332" y="${ys[i]+30}" font-size="10" text-anchor="middle">${v.transport}</text></g>`; });
      s+=`<text x="252" y="320" font-size="10">solid: local stdio, dashed: remote HTTP</text>`;
