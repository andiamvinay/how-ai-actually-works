        <div><b>Resources</b>${v.resources.map(r=>`<div class="cap"><code>${esc(r)}</code></div>`).join('')}<b style="display:block;margin-top:.5rem">Prompts</b>${v.prompts.length?v.prompts.map(p=>`<div class="cap"><code>${esc(p)}</code></div>`).join(''):'<div class="cap muted">none</div>'}</div></div>
        <small class="muted">Client asks the server what it offers</small>
        <pre class="prompt json">${jsonHtml({jsonrpc:'2.0',id:1,method:'tools/list'})}</pre>
        <small class="muted">Server replies. The host passes these to the model as tool definitions.</small>
        <pre class="prompt json">${jsonHtml(listResp)}</pre>
        <small class="muted">When the model picks ${tn}, the client sends</small>
        <pre class="prompt json">${jsonHtml({jsonrpc:'2.0',id:2,method:'tools/call',params:{name:tn,arguments:JSON.parse(ta.replace(/"string\??"/g,'"example"').replace(/"date"|"datetime"/g,'"2026-10-28"').replace(/"string\[\]"/g,'["sam@example.com"]'))}})}</pre>`;
      const a=+$('[data-a]',el).value, sv=+$('[data-s]',el).value;
      $('[data-ao]',el).textContent=a; $('[data-so]',el).textContent=sv; $('[data-mn]',el).textContent=(a*sv).toLocaleString(); $('[data-mp]',el).textContent=(a+sv).toLocaleString();
    };
    $('[data-a]',el).oninput=draw; $('[data-s]',el).oninput=draw;
    draw();
  },
  illustrative:false,
  prod:'MCP lets a platform team build a connector once and make it available to every AI app in the company. The flip side is security: every server you connect can expose powerful tools and untrusted data to the model. Review servers like you review dependencies, scope their credentials tightly, and prefer read-only tools unless writes are truly needed.',
  quiz:[
    {q:'In MCP, the component that actually exposes tools and resources is the:',o:['Host','Client','Server','Tokenizer'],a:2,why:'Servers wrap a service. Hosts are the AI apps. Clients are the connectors inside hosts.'},
    {q:'With 10 AI apps and 20 services, a shared protocol cuts the integration work from 200 custom connectors to roughly:',o:['10','20','30','2,000'],a:2,why:'Each app implements the protocol once and each service gets one server: 10 + 20.'},
    {q:'Which is an MCP resource rather than a tool?',o:['create_event','run_query','A database schema the app can read into context','send_email'],a:2,why:'Resources are data to read. Tools are actions to take.'}
  ]
};

/* ===== Module 21: Multi-agent systems ===== */
MODULES[21] = {
  intro:`<p>Some tasks are too broad for one agent's context window. <strong>Multi-agent</strong> systems split the work.</p>
  <ul>
    <li><strong>Orchestrator-worker</strong>: a lead agent plans, hands subtasks to worker agents, then combines their results.</li>
    <li><strong>Parallel subagents</strong>: independent subtasks run at the same time, each worker starting with a clean, focused context.</li>
    <li><strong>Handoffs</strong>: one agent passes the conversation to a specialist, such as triage handing off to billing.</li>
  </ul>
  <p>The trade-off is real. Parallel workers cut wall-clock time and keep each context small, but every worker repeats some setup and explores on its own, so total tokens, and cost, usually go up. If subtasks depend on each other, parallelism disappears and you pay the overhead for nothing.</p>`,
  hint:'Press Play to run both designs on the same research task. Then add subtasks, or make them depend on each other.',
  mount(el,c){
    let n=4, dep=false, T=0, run=null, A, B;
    el.innerHTML=`<p class="task"><b>Task:</b> Write a report comparing four vendors on price, security, support and roadmap.</p>
      <div class="controls" style="margin-top:0">
        <div class="ctl" style="max-width:14rem"><label>Subtasks <output data-no>4</output></label><input type="range" min="2" max="8" step="1" value="4" data-n></div>
        <div class="ctl" style="flex:0 1 auto"><label>Subtasks depend on each other</label><button class="btn-ghost" data-dep aria-pressed="false">No</button></div>
        <div class="row"><button class="btn" data-play>Play</button><button class="btn-ghost" data-reset>Reset</button></div>
      </div>
      <div data-panels></div>
      <p class="msg" data-msg></p>
      <p class="muted" style="font-size:.85rem;margin:0">Illustrative model: each tool round adds 5,000 tokens of results and takes 20 seconds. The single agent keeps a short note per subtask. Workers start fresh and search a bit more broadly. Cost assumes $3 per million tokens.</p>`;
    const build=()=>{ A=MultiSim.single(n); B=MultiSim.orchestrated(n,dep); T=0; draw(); };
    const maxT=()=>Math.max(A.time,B.time);
    const panel=(name,sim)=>{
      const M=maxT(), W=640, L=92, R=8, rh=24, top=6, H=top+sim.lanes.length*rh+20, sc=(W-L-R)/M;
      let s=`<svg viewBox="0 0 ${W} ${H}" aria-label="${name} timeline">`;
      sim.lanes.forEach((ln,k)=>{ s+=`<text x="${L-8}" y="${top+k*rh+rh/2+4}" font-size="11" text-anchor="end">${ln}</text><line class="ax" x1="${L}" y1="${top+k*rh+rh/2}" x2="${W-R}" y2="${top+k*rh+rh/2}"/>`; });
      sim.segs.forEach((sg,k)=>{ if(sg.start>=T) return; const w=(Math.min(sg.end,T)-sg.start)*sc; const col=sg.lane===0?(sg.label==='Plan'||sg.label==='Synthesize'?'var(--viz-3)':'var(--viz-2)'):reqColor(sg.lane);
        s+=`<rect x="${(L+sg.start*sc).toFixed(1)}" y="${top+sg.lane*rh+3}" width="${Math.max(0,w-1.5).toFixed(1)}" height="${rh-6}" rx="4" style="fill:${col}"/>`;
        if(w>58) s+=`<text x="${(L+sg.start*sc+5).toFixed(1)}" y="${top+sg.lane*rh+rh/2+4}" font-size="10" style="fill:#0F172A;font-weight:700">${sg.label}</text>`; });
      s+=`<line x1="${L+T*sc}" y1="0" x2="${L+T*sc}" y2="${top+sim.lanes.length*rh}" style="stroke:var(--ink);stroke-width:2"/><text x="${L}" y="${H-4}" font-size="11">0 s</text><text x="${W-R}" y="${H-4}" font-size="11" text-anchor="end">${M} s</text></svg>`;
      const tk=MultiSim.tokensAt(sim,T), fin=T>=sim.time;
      return `<div class="bpanel"><div class="row" style="justify-content:space-between"><h3 class="subh" style="margin:0">${name}</h3><span class="muted num">${fin?'done':'running'}</span></div>${s}
        <div class="stats tight"><div class="stat"><span>Wall-clock time</span><strong>${Math.round(Math.min(T,sim.time))} s</strong></div><div class="stat"><span>Tokens so far</span><strong>${Math.round(tk/1000)}K</strong></div><div class="stat"><span>Cost so far</span><strong>$${(tk*3/1e6).toFixed(2)}</strong></div><div class="stat"><span>Biggest single context</span><strong>${Math.round(sim.peak/1000)}K</strong></div></div></div>`;
    };
    const draw=()=>{ $('[data-panels]',el).innerHTML=panel('Single agent',A)+panel('Orchestrator and workers',B);
      if(T>=maxT()){ const ft=A.time-B.time, tr=B.tokens/A.tokens;
        $('[data-msg]',el).innerHTML= ft>0 ? `<b>Orchestrator-worker finished ${ft} s sooner</b> but used ${fmt(tr,1)}× the tokens, about $${((B.tokens-A.tokens)*3/1e6).toFixed(2)} more for this one run. Each worker also started with a clean, focused context.`
          : `<b>The single agent ${ft<0?`finished ${-ft} s sooner`:'tied on time'}</b> and used ${Math.round((1-A.tokens/B.tokens)*100)}% fewer tokens. ${dep?'With dependent subtasks the workers run one after another, so you pay coordination overhead without the parallel speed-up.':'With so few subtasks, planning and synthesis overhead cancel out the parallel gain.'}`; }
      else $('[data-msg]',el).textContent=`t = ${T} s`; };
    const stop=()=>{ if(run){c.stop(run);run=null} $('[data-play]',el).textContent='Play'; };
    $('[data-play]',el).onclick=()=>{ if(run){stop();return} if(T>=maxT()) T=0; $('[data-play]',el).textContent='Pause'; const stepT=Math.max(1,Math.ceil(maxT()/120)); run=c.every(()=>{ T=Math.min(maxT(),T+stepT); draw(); if(T>=maxT()) stop(); },50); };
    $('[data-reset]',el).onclick=()=>{ stop(); T=0; draw(); };
    $('[data-n]',el).oninput=e=>{ stop(); n=+e.target.value; $('[data-no]',el).textContent=n; build(); };
    $('[data-dep]',el).onclick=e=>{ dep=!dep; e.currentTarget.setAttribute('aria-pressed',String(dep)); e.currentTarget.textContent=dep?'Yes':'No'; stop(); build(); };
    build();
  },
  prod:'Use multiple agents when the work is broad, parallel and valuable enough to justify several times the tokens, such as open-ended research. For tightly coupled tasks like most coding changes, one agent with good context management is usually cheaper and more reliable. Whatever you pick, give workers precise briefs: vague handoffs are the most common multi-agent failure.',
  quiz:[
    {q:'The main benefit of parallel worker agents is:',o:['Lower total token usage','Lower wall-clock time on independent subtasks, with smaller focused contexts','No need for tools','Guaranteed better answers'],a:1,why:'They trade tokens for time and context focus.'},
    {q:'Why do multi-agent systems often use more tokens overall?',o:['Workers repeat setup context and explore independently','Tokens get more expensive in parallel','The orchestrator uses a larger vocabulary','They cannot use caching'],a:0,why:'Every worker needs its own instructions and does its own searching, and the orchestrator must read their results.'},
    {q:'When are orchestrator-workers a poor fit?',o:['When subtasks are independent','When subtasks depend tightly on each other\'s results','When the task is a broad research survey','When speed matters'],a:1,why:'Dependencies force sequential execution, so you pay the overhead without the speed-up.'}
  ]
};

/* ===== Module 22: Evals, safety and guardrails ===== */
MODULES[22] = {
  intro:`<p>You can't improve what you don't measure. Public <strong>benchmarks</strong> compare models in general, but they rarely predict how a model does on your task. <strong>Task-specific evals</strong> are a fixed set of real inputs with known good outputs, run on every prompt or model change. For open-ended outputs, <strong>LLM-as-judge</strong> uses a model with a written rubric to grade answers. Check its grades against human labels before you trust it.</p>
  <p>Systems that read outside content face <strong>prompt injection</strong>: instructions hidden in a web page, email or document that try to hijack the model. Because the model sees instructions and data as the same stream of tokens, no single defense is perfect. You layer them:</p>
  <ul>
    <li><strong>Treat retrieved content as data</strong>: wrap it in clear markers and tell the model never to follow instructions inside.</li>
    <li><strong>Classify inputs</strong>: scan tool results for instruction-like text before the model sees them.</li>
    <li><strong>Limit actions</strong>: least-privilege tools, allow-lists, and <strong>human-in-the-loop</strong> approval for anything risky.</li>
    <li><strong>Validate outputs</strong>: check structure, scan for sensitive data, and block unsafe responses before they reach users or systems.</li>
  </ul>`,
  hint:'Run the agent with no guardrails, then switch defenses on one at a time. Try the disguised attack too.',

    el.innerHTML=`<p class="task"><b>Setup:</b> a support agent with two tools, <code>search_kb</code> and <code>send_email</code>. Someone has planted an instruction inside the refund policy page. Nothing is really sent in this demo.</p>
      <div class="controls" style="margin-top:0">
        <div class="ctl" style="flex:0 1 auto"><label>Attack</label><div class="row"><button class="btn-ghost" data-at="basic" aria-pressed="true">Hidden comment</button><button class="btn-ghost" data-at="disguised" aria-pressed="false">Disguised as IT security</button></div></div>

/* tab helper for multi-part interactives */
function mountTabs(el, tabs){
  el.innerHTML=`<div class="tabs" role="tablist">${tabs.map((t,i)=>`<button role="tab" class="tab" data-tab="${i}" aria-selected="${i===0}">${t[0]}</button>`).join('')}</div>${tabs.map((t,i)=>`<div class="tabpane" data-pane="${i}" ${i?'hidden':''}></div>`).join('')}`;
  const done=new Set();
  const show=i=>{ $$('[data-tab]',el).forEach(b=>b.setAttribute('aria-selected',String(+b.dataset.tab===i))); $$('[data-pane]',el).forEach(p=>p.hidden=+p.dataset.pane!==i); if(!done.has(i)){ done.add(i); tabs[i][1]($(`[data-pane="${i}"]`,el)); } };
  $$('[data-tab]',el).forEach(b=>b.onclick=()=>show(+b.dataset.tab));
  show(0);
}

    <li><strong>Matrices</strong> are grids of numbers that transform vectors. Multiplying a vector by a matrix rotates, stretches or squashes it. Every neural network layer is a matrix multiply, and GPUs exist to do them fast.</li>

    <li><strong>Derivatives</strong> say how much an output changes when you nudge an input. The <strong>chain rule</strong> multiplies derivatives through a chain of functions, and backpropagation is the chain rule applied to a whole network.</li>

/* ===== Module 24: ML fundamentals ===== */
MODULES[24] = {
  intro:`<p>A few classic ML ideas come up in every AI interview, even for LLM roles.</p>
  <p><strong>Train, validation and test splits.</strong> Fit on training data, tune choices on validation data, and report final results on test data you never touched. Judging a model on data it trained on hides overfitting.</p>
  <p><strong>Overfitting and underfitting.</strong> A model that is too simple misses the pattern. One that is too flexible memorizes the noise, scoring perfectly on training data and badly on new data. <strong>Regularization</strong> (penalizing large weights), more data and early stopping push back.</p>
  <p><strong>Classification metrics.</strong> Accuracy misleads when classes are imbalanced. <strong>Precision</strong> asks, of what I flagged, how much was right? <strong>Recall</strong> asks, of what was really there, how much did I catch? <strong>F1</strong> balances the two, and the <strong>ROC curve</strong> shows the trade-off across every threshold, summarized by <strong>AUC</strong>.</p>`,

/* ===== Module 25: Inside a transformer block ===== */

/* ===== Module 26: Adapting models ===== */

/* ===== Module 27: Vector search internals ===== */
MODULES[27] = {
  intro:`<p>Module 5 showed what embeddings are. At scale, the question is how to find the nearest few among millions or billions of vectors quickly.</p>
  <p><strong>Exact (brute-force) search</strong> compares the query with every vector. Perfect recall, but cost grows linearly, which gets slow and expensive beyond a few million vectors.</p>
  <p><strong>Approximate nearest neighbor (ANN)</strong> indexes trade a little recall for huge speed-ups:</p>
  <ul>
    <li><strong>IVF</strong> (inverted file) clusters vectors with k-means. A query only scans the few clusters whose centers are closest, controlled by <code>nprobe</code>.</li>
    <li><strong>HNSW</strong> builds a graph where each vector links to its neighbors, plus sparse long-range layers for big jumps. Search walks greedily toward the query, keeping a candidate list of size <code>ef</code>.</li>
    <li><strong>Product quantization (PQ)</strong> compresses vectors into short codes to cut memory, often combined with IVF.</li>
  </ul>
  <p>Every index has the same dial: more work per query means higher recall and higher latency.</p>`,
  hint:'Click anywhere on the map to place a query. Switch methods and adjust nprobe or ef, watching recall against the number of distance computations.',

      VIdx.pts.forEach((pt,i)=>{ const v=vis.has(i); s+=`<circle cx="${pt[0]*W}" cy="${pt[1]*H}" r="${got.has(i)?4.5:2.6}" style="fill:${got.has(i)?'var(--viz-4)':v?'var(--viz-2)':'var(--ink-3)'};opacity:${v||got.has(i)?1:.3}"/>`; if(truth.has(i)) s+=`<circle cx="${pt[0]*W}" cy="${pt[1]*H}" r="8" style="fill:none;stroke:var(--ink);stroke-width:1.5"/>`; });

/* ===== Module 28: Serving at scale ===== */
MODULES[28] = {
  intro:`<p>Serving a model for real traffic is a capacity-planning problem.</p>
  <ul>
    <li><strong>Tensor parallelism</strong> splits each layer's matrices across GPUs in one server, which needs very fast links between them. It is used when a model doesn't fit on one GPU.</li>
    <li><strong>Pipeline parallelism</strong> puts different layers on different GPUs or servers, passing activations along.</li>
    <li><strong>Data parallelism</strong> runs full copies (replicas) of the model, each serving its own share of traffic.</li>
  </ul>
  <p>The metrics that matter: <strong>TTFT</strong> (time to first token), <strong>TPOT</strong> (time per output token), <strong>throughput</strong> (tokens or requests per second) and tail latency like <strong>p99</strong> (the slowest 1% of requests). Larger batches raise throughput but slow each request. Running GPUs near full utilization makes queues, and the tail, explode.</p>
  <p>Two cheap wins: <strong>prompt caching</strong> reuses the KV cache of a repeated prefix such as a long system prompt, and <strong>constrained decoding</strong> masks any token that would break a required format (like a JSON schema), guaranteeing valid structured output.</p>`,
  hint:'Size a deployment on the first tab. On the second, push utilization up and watch p99 latency take off.',

          $('[data-msg]',p).innerHTML= r.gpus===1?'Fits on one GPU. Scale out with <b>data parallelism</b>: add replicas as traffic grows.': r.gpus<=8?`Split each replica with <b>tensor parallelism</b> across ${r.gpus} GPUs in one server, then add replicas for traffic.`:`More than one 8-GPU server per replica: combine tensor parallelism inside each server with <b>pipeline parallelism</b> across servers, or quantize further.`;

      }],
      ['Latency and the tail', p=>{

  prod:'Set service-level objectives on TTFT and p99, not averages, and load-test at realistic prompt and output lengths. Plan headroom: running at 60 to 70% utilization keeps the tail under control. Track cost per 1,000 requests alongside latency, because batching, quantization and caching move both at once.',
  quiz:[
    {q:'A 70B model in FP16 doesn\'t fit on one 80 GB GPU. The standard fix within one server is:',o:['Data parallelism','Tensor parallelism across several GPUs','A larger batch size','A higher temperature'],a:1,why:'Tensor parallelism splits each layer\'s matrices so the model spans GPUs. Data parallelism copies the whole model, which still has to fit.'},
    {q:'Why plan capacity around p99 latency instead of the average?',o:['The average is hard to compute','Users notice the slow requests, and tail latency grows much faster than the median under load','p99 is always lower','It reduces token usage'],a:1,why:'One request in a hundred being very slow still affects many users at scale.'},

    qa:[
      ['Throughput is great but users complain about slowness. What do you check?','Separate TTFT from TPOT. Long TTFT points to queueing or long prompts: add capacity, use prompt caching, or separate prefill from decode. Slow TPOT points to oversized batches: cap batch size for latency-sensitive traffic.'],

      <div class="card2" data-card aria-live="polite"></div>

      </tbody></table></div>
      <p class="muted" style="font-size:.85rem">Figures are rules of thumb for estimation. Check current hardware and pricing before quoting exact numbers.</p>`;
    const pool=()=>all.filter(c=>filter==='All'||c.sec===filter);
    const pick=()=>{ const p=pool(); if(!p.length){cur=null;return} const w=p.map(c=>R[c.id]==='good'?1:R[c.id]==='shaky'?5:3); let s=w.reduce((a,b)=>a+b,0)*Math.random(); for(let i=0;i<p.length;i++){ s-=w[i]; if(s<=0){ if(cur&&p.length>1&&p[i].id===cur.id) continue; cur=p[i]; return; } } cur=p[p.length-1]; };
    const draw=()=>{
      const card=$('[data-card]',el);
      if(!cur){ card.innerHTML='<p class="muted">No cards for this section yet.</p>'; }
      else card.innerHTML=`<p class="muted" style="margin:0 0 .4rem;font-size:.85rem">${esc(cur.sec)}, ${esc(cur.mod)}${R[cur.id]?`, last rated ${R[cur.id]}`:''}</p><p class="cq">${esc(cur.q)}</p>
        ${shown?`<div class="ca">${esc(cur.a)}</div><div class="row" style="margin-top:.75rem"><button class="btn-ghost" data-rate="shaky">Shaky, show again soon</button><button class="btn" data-rate="good">Got it</button></div>`:`<button class="btn" data-show>Reveal model answer</button>`}`;

    };

      if(e.target.closest('[data-show]')){ shown=true; draw(); }

      if(e.target.closest('[data-resetd]')){ for(const k in R) delete R[k]; saveState(); draw(); }
    });
    pick(); draw();
  },

 oneLiner:'Start from requirements and numbers, then design the components, failure modes and evals that meet them.'}
};
for(const n in STICK){ if(MODULES[n]) MODULES[n].stick=STICK[n]; }

function stickHtml(s){
  if(!s) return '';
  const a=s.analogy;
  return `<section class="stick" aria-labelledby="stick-h">
    <h2 id="stick-h">Make it stick</h2>
    <div class="stick-card"><h3>Think of it like ${a.title}</h3><p>${a.story}</p>${a.steps?`<ol class="stick-steps">${a.steps.map(x=>`<li>${x}</li>`).join('')}</ol>`:''}${a.after?`<p>${a.after}</p>`:''}
      <div class="scroll-x"><table class="maptbl"><thead><tr><th>In the analogy</th><th>In AI</th></tr></thead><tbody>${s.map.map(([x,y])=>`<tr><td>${x}</td><td><b>${y}</b></td></tr>`).join('')}</tbody></table></div></div>
    <div class="stick-card worked"><h3>Worked example: ${s.example.title}</h3><p>${s.example.intro}</p>
      <ol class="wsteps" data-ws></ol>
      <div class="row"><button class="btn" data-wnext>Take next step</button><button class="btn-ghost" data-wreset>Reset</button><span class="muted num" data-wpos style="margin-left:auto"></span></div></div>
    ${(s.extra||[]).map(([h,t])=>`<div class="stick-card"><h3>${h}</h3><p>${t}</p></div>`).join('')}
    ${s.real?`<div class="stick-card"><h3>How this shows up in a real LLM</h3><p>${s.real}</p></div>`:''}
    <p class="stick-key"><b>Key distinction:</b> ${s.distinction}</p>
    <p class="stick-one"><b>In one sentence:</b> ${s.oneLiner}</p>
  </section>`;
}
function wireStick(root, s){
  if(!s) return;
  const list=$('[data-ws]',root), steps=s.example.steps, mx=s.example.bar?Math.max(...steps.map(x=>x.bar||0)):0; let k=1;
  const draw=()=>{
    list.innerHTML=steps.slice(0,k).map((st,i)=>`<li class="${i===k-1?'now':''}"><b>${esc(st.t)}</b><pre class="wcalc">${esc(st.calc)}</pre>${s.example.bar&&st.bar!==undefined?`<div class="wbar"><span style="width:${Math.max(1,st.bar/mx*100).toFixed(1)}%"></span><small class="num">${esc(s.example.bar)}: ${st.bar}</small></div>`:''}${st.note?`<p>${st.note}</p>`:''}</li>`).join('');
    $('[data-wpos]',root).textContent=`Step ${k} of ${steps.length}`;
    $('[data-wnext]',root).disabled=k>=steps.length;
  };
  $('[data-wnext]',root).onclick=()=>{ if(k<steps.length){k++;draw()} };
  $('[data-wreset]',root).onclick=()=>{ k=1; draw(); };
  draw();
}
/* ===== Interview prep for modules 1 to 22 (modules 23+ carry their own) ===== */
const IV = {
1:{explain:'AI is the umbrella: any system doing something we would call smart, including hand-written rules and search. Machine learning is the subset that learns rules from data instead of having them coded. Deep learning is ML with many-layer neural networks, which works on raw images, audio and text. Generative AI is deep learning that produces new content, and LLMs sit there. In practice the key skill is picking the cheapest tool that works: a rule if the logic is known, classic ML for labels and numbers, an LLM for open-ended language.',
 qa:[['When would you not use an LLM?','When the logic is exact and known (validation, routing by a field), when you need deterministic, auditable output, or when a small classifier does the job at a fraction of the cost and latency. LLMs earn their place on fuzzy, open-ended language tasks.'],
     ['What is the difference between supervised, unsupervised and self-supervised learning?','Supervised learns from labeled examples. Unsupervised finds structure without labels, like clustering. Self-supervised creates labels from the data itself, such as predicting the next word, which is how LLMs pretrain on raw text at scale.'],
     ['What makes generative AI different from a classifier?','A classifier maps an input to one of a fixed set of labels. A generative model learns the distribution of the data and samples new outputs from it, so its output space is open-ended, and so are its failure modes, such as hallucination.']]},
2:{explain:'Machine learning has four parts: data, a model with adjustable parameters, a loss that scores how wrong the model is, and an optimizer. Gradient descent computes the gradient of the loss with respect to every parameter, which points uphill, and steps the other way, scaled by a learning rate. Repeat over many batches of data until the loss stops improving. LLM training is this exact loop with billions of parameters and trillions of tokens, using variants like Adam that adapt the step size per parameter.',
 qa:[['What happens if the learning rate is too high or too low?','Too high and updates overshoot the minimum, so loss oscillates or diverges to infinity. Too low and training crawls and can stall. In practice you use a warmup followed by a decaying schedule.'],
     ['What is stochastic or mini-batch gradient descent?','Instead of computing the gradient over the whole dataset, you estimate it from a small random batch each step. It is far cheaper per step, and the noise even helps escape poor regions. Every large model is trained this way.'],
     ['Why is Adam more popular than plain SGD for transformers?','Adam keeps running averages of each parameter\'s gradient and squared gradient, giving every parameter its own adaptive step size. That copes well with the very uneven gradient scales in transformers. The cost is two extra values stored per parameter.']]},
3:{explain:'A neuron multiplies inputs by weights, adds a bias and applies a nonlinear activation such as ReLU. A layer is many neurons in parallel, which is just a matrix multiply plus an activation, and a network stacks layers. Training adjusts the weights with gradient descent, using backpropagation to get each weight\'s gradient. The nonlinearity is essential: without it, any stack of layers collapses into a single linear function. Parameter count drives memory: at 16 bits, every billion parameters needs about 2 GB.',
 qa:[['Why do neural networks need activation functions?','Without them, layers compose into one linear map, so depth adds nothing. Nonlinearities like ReLU or GELU let the network bend decision boundaries and approximate complex functions.'],
     ['What is backpropagation in one sentence?','It is the chain rule applied backward from the loss through every layer, so one backward pass gives the gradient for every weight at roughly the cost of the forward pass.'],
     ['How much memory does a 13B model need to serve?','Weights alone are about 26 GB in FP16 or about 13 GB in INT8, plus memory for the KV cache that grows with context length and concurrent requests, plus some runtime overhead.']]},
4:{explain:'LLMs read tokens, not characters. A tokenizer splits text into chunks from a fixed vocabulary, typically 32K to 200K entries, and maps each to an integer ID. Most use byte-pair encoding: start from bytes and repeatedly merge the most frequent adjacent pair. Common words become one token and rare ones split into pieces. This explains quirks like miscounting letters in "strawberry", and it drives cost, because pricing, context limits and latency are all measured in tokens. English averages about 1.3 tokens per word.',
 qa:[['Why do LLMs struggle with spelling, counting letters or reversing strings?','They see token IDs, not characters. "strawberry" might be three opaque tokens, so letter-level structure is only learned indirectly. Tools or character-level prompting help.'],
     ['How would you estimate the token cost of a feature?','Measure real prompts and outputs with the provider\'s tokenizer, multiply by requests per day and by separate input and output prices, and include system prompts and retrieved context, which often dominate input tokens.'],
     ['What is the trade-off in vocabulary size?','A bigger vocabulary means fewer tokens per text, so shorter sequences and cheaper attention, but a bigger embedding and output layer. Multilingual models use larger vocabularies so non-English text is not penalized as heavily.']]},
5:{explain:'An embedding is a learned vector that represents a token, sentence or document. Training places items used in similar contexts close together, so meaning becomes geometry, and consistent relationships become consistent directions, like king minus man plus woman landing near queen. Similarity is usually cosine similarity, the cosine of the angle between vectors. Embedding models for search typically output 384 to 3,072 dimensions. They power semantic search, clustering, deduplication, recommendations and RAG retrieval.',
 qa:[['What is the difference between the token embeddings inside an LLM and a sentence embedding model?','Token embeddings are the input lookup table of the LLM, one vector per token. Sentence embedding models are trained, often contrastively, to map a whole passage to one vector so that similar meanings score high, which is what retrieval needs.'],
     ['Why must you use the same embedding model for indexing and querying?','Each model defines its own vector space. Vectors from different models, or even different versions, are not comparable, so a model change means re-embedding the whole corpus.'],
     ['How do you choose an embedding model?','Evaluate candidates on your own queries with labeled relevant documents, measuring recall@k. Then weigh dimension (storage and speed), context length, language coverage, cost and whether it can be self-hosted.']]},
6:{explain:'Attention lets each token gather information from other tokens so its representation depends on context. Each token produces a query, a key and a value. Its query is dotted with every key, scaled by the square root of the dimension, and passed through softmax to get weights, which mix the values. Multi-head attention runs several of these in parallel to capture different relationships. Positional information is added because attention alone ignores order. Decoder models use a causal mask so tokens only see the past. Cost grows with the square of sequence length.',
 qa:[['Why is attention quadratic, and why does it matter?','Every token scores every other token, so n tokens need n² scores. Doubling context roughly quadruples attention work and memory traffic, which is why long contexts are slow and expensive.'],
     ['What is the difference between self-attention and cross-attention?','In self-attention, queries, keys and values all come from the same sequence. In cross-attention, queries come from one sequence and keys and values from another, as in encoder-decoder translation or image-to-text models.'],
     ['What is the role of the causal mask?','It blocks attention to future positions, so during training the model cannot cheat by looking at the token it must predict, and generation stays consistent with training.']]},
7:{explain:'LLMs are trained in stages. Pretraining is next-token prediction over trillions of tokens, minimizing cross-entropy, the negative log probability of the true next token. That gives knowledge and fluency. Supervised fine-tuning on curated instruction-response pairs teaches the model to act as an assistant. Preference tuning, such as RLHF with human rankings or RLAIF with AI feedback guided by principles, pushes it toward helpful, honest and harmless answers. Knowledge mostly comes from pretraining. Behavior mostly comes from post-training.',
 qa:[['What is the difference between pretraining and fine-tuning?','Pretraining learns general language and world knowledge from massive unlabeled text and costs millions of GPU hours. Fine-tuning adapts an existing model with far less data and compute to a task, format or behavior.'],
     ['Explain RLHF at a high level.','Collect pairs of model responses and have people pick the better one. Train a reward model to predict those preferences, then optimize the LLM to score highly on it while staying close to the original model. Alternatives like DPO skip the separate reward model.'],
     ['Why do models hallucinate?','They are trained to produce plausible continuations, not to verify facts. When the training data is thin or missing, the most plausible text can be wrong, delivered with the same confidence. Retrieval, citations and permission to say "I don\'t know" reduce it.']]},
8:{explain:'At each step the model outputs a probability for every token. Decoding picks one. Greedy takes the most likely token, which is deterministic but prone to repetition. Temperature divides the logits before softmax: below 1 sharpens, above 1 flattens. Top-k keeps the k most likely tokens; top-p keeps the smallest set whose probability adds up to p, adapting to the model\'s confidence. Beam search keeps several best partial sequences. Use low temperature for extraction and tool calls, moderate temperature with top-p for creative text.',
 qa:[['Why does temperature 0 not always give identical outputs in production?','Batching, parallel floating-point reductions and different hardware can change the order of operations, which shifts near-tied logits. Ties and some serving optimizations can also flip choices. Treat it as near-deterministic.'],
     ['When would you choose top-p over top-k?','Top-p adapts: it keeps few tokens when the model is confident and more when it is unsure, while a fixed k can be too loose or too tight. Many systems use both together.'],
     ['Why is beam search rarely used for chat?','It optimizes for the single most likely sequence, which tends to be bland and repetitive for open-ended text, and it costs several times the compute. It still suits tasks with one right answer, like translation.']]},
9:{explain:'Inference has two phases. Prefill runs the whole prompt through the model in parallel. That is compute-bound and sets time to first token. Decode then produces one token at a time, because each token depends on the last. Every decode step reads all the weights from memory to do a little math for one token, so it is memory-bandwidth-bound: time per token is roughly model bytes divided by bandwidth. That is why batching many requests together is the main lever for throughput, and why prompt length and output length hurt latency in different ways.',
 qa:[['What are TTFT and TPOT?','Time to first token measures prefill plus queueing and is what users feel as responsiveness. Time per output token measures decode speed. Total latency is roughly TTFT plus TPOT times the number of output tokens.'],
     ['Why is decode memory-bound but prefill compute-bound?','In prefill, each weight read from memory is reused across all prompt tokens, so math dominates. In decode, each weight read serves a single token per request, so the GPU waits on memory. Batching raises reuse during decode.'],
     ['How would you cut latency for a chatbot with long system prompts?','Cache the shared prefix (prompt caching) to skip most prefill, stream tokens so users see output immediately, keep outputs concise, and consider a smaller or quantized model, or speculative decoding, for faster decode.']]},
10:{explain:'In attention, each new token needs the keys and values of all previous tokens. Recomputing them every step wastes work that grows with sequence length. The KV cache stores each token\'s keys and values once in GPU memory and reuses them, so each decode step only computes the newest token. The cost is memory: 2 times layers times KV heads times head dimension times sequence length times bytes, per sequence. At long contexts and high concurrency the KV cache, not the weights, fills the GPU, which caps batch size and drives cost.',
 qa:[['How big is the KV cache for Llama 2 7B at 4,096 tokens?','2 × 32 layers × 32 heads × 128 dims × 4,096 tokens × 2 bytes ≈ 2.1 GB per sequence. With 30 concurrent users that is about 64 GB, more than the 14 GB of weights.'],
     ['How does grouped-query attention reduce memory?','Several query heads share one key-value head. Llama 3 8B has 32 query heads but 8 KV heads, so its KV cache is a quarter of what full multi-head attention would need, with little quality loss.'],
     ['Name three ways to reduce KV cache memory.','Grouped-query or multi-query attention, a quantized KV cache in FP8 or INT8, paged allocation to avoid waste, prefix sharing across requests, and sliding-window or limited-context attention.']]},
11:{explain:'Before PagedAttention, servers stored each request\'s KV cache in one contiguous region sized for the maximum possible length. Most of it sat empty, and freed regions left holes too small to reuse, so much of GPU memory was wasted. PagedAttention, from vLLM, splits the cache into small fixed-size blocks allocated on demand, anywhere in memory, tracked by a per-request block table, just like OS virtual memory. Waste drops to the last partial block, so many more requests fit at once. Blocks also allow sharing identical prefixes such as a common system prompt.',
 qa:[['What problem does PagedAttention solve?','Memory fragmentation in the KV cache: over-reservation for maximum length (internal) and unusable gaps between allocations (external). Fixing it lets a server batch several times more requests on the same GPU.'],
     ['What happens when a paged server runs out of blocks?','It preempts some requests, either swapping their blocks to CPU memory or dropping them to recompute later, and resumes them when space frees up. Admission control keeps headroom to make this rare.'],
     ['How does prefix sharing relate to prompt caching?','Identical prefixes produce identical keys and values, so their blocks can be stored once and referenced by many requests. Prompt caching extends this across requests over time, skipping prefill for the cached part.']]},
12:{explain:'One request barely uses a GPU during decode, so servers batch requests: one read of the weights then serves many tokens. Static batching runs a fixed group until its longest member finishes, so slots of short requests sit idle. Continuous batching, also called iteration-level batching, reschedules at every decode step: when a request finishes, a waiting one takes its slot immediately. That raises utilization and throughput and cuts queueing time. It is the default in vLLM, TGI, TensorRT-LLM and SGLang, and it is why your latency depends on other traffic.',
 qa:[['What is the trade-off between throughput and latency in batching?','Bigger batches raise total tokens per second and lower cost per token, but each request shares each step with more others, so per-request speed drops and tail latency rises. You tune batch size against your latency targets.'],
     ['Why is continuous batching better than static batching?','Static batching waits for the slowest request in the batch. Continuous batching refills free slots every step, so the GPU stays busy and new requests start sooner, often giving several times the throughput.'],
     ['How do prefill and decode interfere in a batch?','A long prefill can stall decode steps for other users and spike their latency. Servers use chunked prefill, splitting long prompts into pieces, or run prefill and decode on separate GPUs (disaggregated serving).']]},
13:{explain:'Three techniques do most of the work. FlashAttention computes exact attention in tiles that fit in fast on-chip memory, never writing the full score matrix to slow GPU memory, so it is faster and uses far less memory. Quantization stores weights in fewer bits, such as INT8 or INT4, cutting memory and speeding up memory-bound decode, at some accuracy cost that methods like GPTQ and AWQ keep small. Speculative decoding has a small draft model guess several tokens that the big model verifies in one pass, giving identical output in fewer slow steps.',
 qa:[['Does FlashAttention change the model\'s outputs?','No. It is an exact reorganization of the same computation, with only tiny floating-point differences. It changes speed and memory, not the math.'],
     ['When does quantization hurt, and how do you check?','Quality loss grows at very low bit-widths and shows up unevenly, often on reasoning, math or long-tail tasks. Run your own task evals before and after, not just a general benchmark.'],
     ['What determines the speed-up from speculative decoding?','How often the big model accepts the draft\'s guesses, how many tokens are drafted per round, and how cheap the draft model is. High acceptance on predictable text, such as code or templated output, gives the biggest wins.']]},
14:{explain:'A dense model uses every parameter for every token. A mixture-of-experts model replaces feed-forward layers with many experts and a small router that sends each token to only the top few, often two. That separates total parameters, which set capacity and memory, from active parameters, which set compute per token. Mixtral 8x7B has about 47 billion total but about 13 billion active. MoE gives big-model quality at closer to small-model speed, but every expert must sit in memory, and training needs a load-balancing loss so a few experts don\'t take all the tokens.',
 qa:[['Does an MoE model need less GPU memory than a dense model of the same total size?','No. All experts must be loaded because any token may route to any of them. MoE saves compute per token, not memory.'],
     ['What is expert collapse, and how is it prevented?','The router learns to send most tokens to a few experts, leaving others undertrained and hardware unbalanced. An auxiliary load-balancing loss and capacity limits per expert keep routing spread out.'],
     ['What makes MoE harder to serve?','Experts are often spread across GPUs (expert parallelism), so tokens move over the network between them, and uneven routing creates hot spots. Batch efficiency also drops because each expert sees only part of the batch.']]},
15:{explain:'A prompt is the model\'s entire world for that request. The system prompt sets role, rules and output format; user messages carry the request. Reliable habits: be specific about the task and why, define the output format exactly, include a few examples, and for multi-step problems ask for reasoning before the answer. The context window caps prompt plus output. Longer contexts cost more, run slower, and models use information at the start and end better than in the middle. Treat prompts like code: version them and test them against an eval set.',
 qa:[['How do you make LLM output reliably machine-readable?','Specify the schema in the prompt, show an example, use the provider\'s structured output or tool-calling mode, keep temperature low, then validate and retry on failure. Constrained decoding guarantees the format where supported.'],
     ['What is "lost in the middle", and how do you design around it?','Models recall facts at the start and end of a long context better than in the middle. Put key instructions and the most relevant data near the edges, retrieve less but more relevant context, and restate the question at the end.'],
     ['How do you improve a prompt systematically?','Build a small eval set of real inputs with expected outputs, change one thing at a time, and compare scores. Read failures to find patterns rather than tuning on one example.']]},
16:{explain:'RAG, retrieval-augmented generation, gives a model knowledge at question time instead of relying on training data. Offline, you split documents into chunks, embed them and store the vectors. At query time, you embed the question, find the most similar chunks, optionally re-rank them, insert the top few into the prompt with source labels, and ask the model to answer only from them with citations. It handles private and fresh data, reduces hallucination, and updates without retraining. Most RAG failures are retrieval failures, so measure retrieval separately.',
 qa:[['RAG or fine-tuning for a company knowledge assistant?','RAG. The knowledge changes, needs citations and needs permission filtering per user. Fine-tuning is better for teaching format, tone or a narrow skill, and doesn\'t reliably add facts.'],
     ['How do you pick chunk size?','Big enough to hold a complete idea, small enough to stay focused, often 200 to 800 tokens with some overlap. Respect document structure like headings, then tune with recall@k on real questions.'],
     ['How do you handle permissions in RAG?','Store access-control metadata on every chunk and filter at retrieval time by the user\'s identity, before anything reaches the prompt. Never rely on the model to withhold content it has already been shown.']]},
17:{explain:'Basic RAG fails in predictable ways. Vector search misses exact strings like error codes and product IDs, so hybrid search adds keyword ranking, BM25, and merges the two lists, often with reciprocal rank fusion. Short or vague queries get rewritten or expanded by an LLM before retrieval. A re-ranker, a cross-encoder or LLM that reads query and passage together, re-scores the top candidates more precisely. GraphRAG builds an entity graph for questions that span many documents. Evaluate retrieval with recall@k and generation with faithfulness to the sources.',
 qa:[['Why does hybrid search often beat pure vector search?','Real queries mix fuzzy meaning with exact identifiers. Embeddings capture meaning but blur codes and rare terms; BM25 nails exact matches. Fusing both covers each method\'s blind spot.'],
     ['What is a cross-encoder re-ranker, and why not use it for everything?','It reads the query and a passage together and outputs a relevance score, which is far more accurate than comparing separate embeddings. It must run once per candidate, so it is too slow for millions of documents but ideal for the top 50 to 100.'],
     ['How do you evaluate a RAG system?','Build a labeled set of real questions with their correct sources. Measure retrieval with recall@k or MRR, then measure answers for faithfulness, completeness and correctness, using LLM-as-judge checked against human labels.']]},
18:{explain:'Tool use, or function calling, lets an LLM act. You send tool definitions, each a name, description and JSON schema, along with the conversation. When a tool would help, the model replies with a structured call and stops. Your code validates the arguments, runs the real function and returns the result as a new message. The model then answers or calls another tool. The model never executes anything itself. Precise tool descriptions matter as much as the prompt, and every call should be treated as untrusted input.',
 qa:[['How do you make tool calling safe?','Validate arguments against the schema, enforce permissions in your code rather than in the prompt, use least-privilege credentials, add timeouts and rate limits, and require human approval for irreversible or external actions.'],
     ['The model keeps calling the wrong tool. What do you check?','Overlapping or vague descriptions, unclear parameter names, too many tools at once, and missing examples. Merge or clarify tools, describe when not to use each one, and test against an eval set of tool-choice cases.'],
     ['What is parallel tool calling?','The model emits several independent tool calls in one response, such as weather for three cities. Your app runs them concurrently and returns all results together, cutting round trips and latency.']]},
19:{explain:'An agent is an LLM using tools in a loop until a goal is met: observe, think, act, repeat. ReAct makes the loop explicit with a thought, an action and an observation at each step. Agents use short-term memory, which is the growing context window, and long-term memory in an external store that survives between runs. They need stopping conditions: goal met, a step, token or time budget exhausted, or a decision that requires a human. Agents trade predictability for flexibility, so use fixed workflows where the steps are known.',
 qa:[['When should you use an agent instead of a fixed workflow?','When the steps can\'t be known in advance, such as open-ended debugging or research. If the sequence is predictable, a coded workflow with LLM calls at specific steps is cheaper, faster and easier to test.'],
     ['How do you keep an agent\'s context from overflowing on long tasks?','Summarize or compact older steps, store bulky tool results externally and keep references, retrieve only what the current step needs, and split work into subagents with fresh contexts.'],
     ['How do you evaluate an agent?','Test end-to-end task success on realistic scenarios, plus intermediate checks such as correct tool choice and number of steps. Track cost and latency per task, and review traces of failures, since many failures are a single bad step early on.']]},
20:{explain:'The Model Context Protocol is an open standard for connecting AI applications to tools and data. Without it, each AI app needs custom code for each service, M times N integrations. With MCP, each service is wrapped once as a server, and any MCP host can use it, M plus N. Hosts are AI apps such as chat clients, IDEs or agents; each host runs a client per server; servers expose tools (actions), resources (data to read) and prompts (templates), over JSON-RPC, locally via stdio or remotely via HTTP.',
 qa:[['What is the difference between MCP and plain function calling?','Function calling is how a model asks for a tool inside one API. MCP standardizes how tools and data are discovered and invoked across applications, so a tool built once works in any compatible host.'],
     ['What are the security risks of MCP servers?','A server can expose powerful actions and feed untrusted content into the model, which enables prompt injection or data leaks. Vet servers like dependencies, scope credentials narrowly, prefer read-only tools, and require approval for sensitive actions.'],
     ['As a platform team, why would you invest in MCP?','You build a connector to an internal system once and every product team\'s AI app can use it, with central control over authentication, permissions, logging and versioning, instead of fifteen teams each building their own.']]},
21:{explain:'Multi-agent systems split work across several agents. In orchestrator-worker designs, a lead agent plans, hands subtasks to workers, and combines their results. Parallel workers cut wall-clock time and each start with a clean, focused context. Handoffs pass a conversation to a specialist agent. The costs are real: workers repeat setup and explore independently, so total tokens and spend go up, and coordination adds failure points. Multi-agent pays off for broad, parallel, high-value tasks like research, and rarely for tightly coupled tasks like most code changes.',
 qa:[['When is a multi-agent design worth the cost?','When subtasks are independent and parallel, the task is too broad for one context window, and the value justifies several times the tokens. Broad research is the classic fit.'],
     ['What is the most common failure in orchestrator-worker systems?','Vague task briefs: workers duplicate effort, drift off scope or return results in incompatible forms. Give each worker a clear objective, output format, tools and stopping rule.'],
     ['How do you debug a multi-agent system?','Log full traces per agent, including prompts, tool calls and handoffs, with a shared request ID. Reproduce failures from saved state, evaluate each agent\'s piece separately, and check whether the orchestrator\'s plan or a worker\'s execution went wrong.']]},
22:{explain:'You cannot improve what you do not measure. Public benchmarks compare models in general; task-specific evals, real inputs with known good outputs, tell you whether your system works and should run on every change. LLM-as-judge grades open-ended outputs against a rubric, once validated against human labels. The main security risk is prompt injection: instructions hidden in content the model reads. Because instructions and data share one token stream, defenses are layered: mark untrusted content, filter inputs, limit tool permissions, require human approval for risky actions, and validate outputs.',
 qa:[['How would you set up evals for a new LLM feature?','Collect a few hundred realistic inputs, including edge cases and past failures, with expected outputs or grading rubrics. Score with code checks where possible and LLM-as-judge where not, validate the judge against humans, and run it in CI on every prompt or model change.'],
     ['What is the difference between direct and indirect prompt injection?','Direct injection comes from the user typing malicious instructions. Indirect injection hides instructions in content the system retrieves, such as web pages, emails or documents, and is more dangerous because the user may be innocent.'],
     ['Can prompt injection be fully prevented?','Not today. Design so that a successful injection can\'t do much: least-privilege tools, no secrets in context, approval for irreversible actions, output checks and monitoring. Treat it like any untrusted input.']]}
};
for(const n in IV){ if(MODULES[n] && !MODULES[n].interview) MODULES[n].interview=IV[n]; }
boot();
